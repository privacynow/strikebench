name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Four independent verification surfaces, split as the audit §16.2 requires: the JUnit matrix,
# the fast source-served browser contracts, the packaged-jar journeys, and the visual/geometry
# matrix. Every browser job calls a lane (dom-tests/lane.js), never an individual file, so a
# suite added or retired in dom-tests changes coverage here without a workflow edit — the drift
# that let this workflow invoke nine deleted npm scripts while still reporting green.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start isolated PostgreSQL
        run: |
          docker compose up -d db
          for attempt in {1..30}; do
            docker compose exec -T db pg_isready -U strikebench -d strikebench_dev && exit 0
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Backend matrix and release jar
        run: mvn -q clean package

      - name: Preserve backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-backend
          path: target/surefire-reports
          retention-days: 14

  # Lane (a): formatters, exact rendered strings, no silent defaults, receipt-to-text mapping.
  # It serves src/main/resources/public directly and mocks every API, so it needs neither a
  # database nor a jar; it must stay fast enough to block every push.
  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dom-tests/package-lock.json

      - name: Install browser runtime
        working-directory: dom-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Source-served deterministic contracts
        working-directory: dom-tests
        run: npm run test:contracts

      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-contracts
          path: |
            target/dom-contracts.tap
            dom-tests/shots
          retention-days: 14

  # Lane (b): the browser drives the artifact we ship. Each shard boots its own jar against its
  # own fresh database (dom-tests/pgtest.js) with its own browser, and lane.js refuses to start
  # if target/strikebench.jar is missing or older than the desk sources it is meant to contain.
  browser-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dom-tests/package-lock.json

      - name: Start isolated PostgreSQL
        run: |
          docker compose up -d db
          for attempt in {1..30}; do
            docker compose exec -T db pg_isready -U strikebench -d strikebench_dev && exit 0
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Package the jar under test
        run: mvn -q clean package -DskipTests

      - name: Install browser runtime
        working-directory: dom-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Includes the auth-on security contract (dom-auth.test.js), which drives a real OIDC
      # issuer against the packaged jar and is the private instance's only sign-in gate.
      - name: Packaged-jar journeys
        working-directory: dom-tests
        run: npm run test:journeys

      - name: Preserve journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-journeys
          path: |
            target/dom-journeys.tap
            dom-tests/shots
          retention-days: 14

  # Lane (c): the §16.4 viewport matrix and overflow/bounding-box assertions. Scaffolded only —
  # no dom-tests/*.visual.test.js exists yet, and the lane reports NOT IMPLEMENTED in the job
  # summary rather than a green count, because zero tests is not evidence of a clean layout.
  browser-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dom-tests/package-lock.json

      - name: Install browser runtime
        working-directory: dom-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Visual and geometry matrix
        working-directory: dom-tests
        run: npm run test:visual

      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-visual
          path: |
            target/dom-visual.tap
            dom-tests/shots
          retention-days: 14

  # Release evidence for the exact branch tip. The aggregator used to demand a TAP per SPA-era
  # lane — all deleted with workspace.html in 8654824 — so it could never succeed and CI simply
  # stopped producing evidence. It now sums the three lanes that exist plus Surefire.
  release-evidence:
    needs: [backend, browser-contracts, browser-journeys, browser-visual]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: target
          merge-multiple: true
      - name: Summarize
        run: |
          node scripts/release-matrix.mjs | tee target/release-matrix.md
          cat target/release-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-matrix
          path: |
            target/release-matrix.md
            target/dom-contracts.tap
            target/dom-journeys.tap
            target/dom-visual.tap
          retention-days: 14
