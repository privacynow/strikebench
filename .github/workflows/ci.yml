name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three independent verification surfaces: the JUnit matrix, the fast source-served browser
# contracts, and the packaged-jar journeys. Every browser job calls a lane (dom-tests/lane.js),
# never an individual file, so a
# suite added or retired in dom-tests changes coverage here without a workflow edit — the drift
# that let this workflow invoke nine deleted npm scripts while still reporting green.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start isolated PostgreSQL
        run: |
          docker compose up -d db
          for attempt in {1..30}; do
            docker compose exec -T db pg_isready -U strikebench -d strikebench_dev && exit 0
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Start one clean backend evidence run
        run: |
          mvn -q clean
          mkdir -p target/surefire-reports
          node -e "require('fs').writeFileSync('target/surefire-reports/run-start.epoch', String(Date.now()))"

      - name: Backend matrix and release jar
        run: mvn -q package

      - name: Bind backend evidence to this source
        run: |
          git rev-parse HEAD > target/surefire-reports/source.sha
          node scripts/artifact-manifest.cjs write

      - name: Preserve the exact jar tested by the backend matrix
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: |
            target/strikebench.jar
            target/strikebench-artifact.json
          retention-days: 14

      - name: Preserve backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-backend
          path: target/surefire-reports
          retention-days: 14

  # Lane (a): formatters, exact rendered strings, no silent defaults, receipt-to-text mapping.
  # It serves src/main/resources/public directly and mocks every API, so it needs neither a
  # database nor a jar; it must stay fast enough to block every push.
  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dom-tests/package-lock.json

      - name: Verify committed contract-lane inventory
        working-directory: dom-tests
        run: node lane.js contracts --list

      - name: Install browser runtime
        working-directory: dom-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Source-served deterministic contracts
        working-directory: dom-tests
        run: npm run test:contracts

      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-contracts
          path: target/dom-contracts.tap
          retention-days: 14

      - name: Preserve contract screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-contracts
          path: dom-tests/shots
          if-no-files-found: ignore
          retention-days: 14

  # Lane (b): the browser drives the artifact we ship. Each suite owns a fresh database, private
  # port, jar process, and browser through dom-tests/packaged-app.js; auth adds a dedicated OIDC
  # fixture to that same lifecycle owner. lane.js refuses to start if target/strikebench.jar is
  # missing or older than the application sources it is meant to contain.
  browser-journeys:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dom-tests/package-lock.json

      - name: Verify committed journey-lane inventory
        working-directory: dom-tests
        run: node lane.js journeys --list

      - name: Start isolated PostgreSQL
        run: |
          docker compose up -d db
          for attempt in {1..30}; do
            docker compose exec -T db pg_isready -U strikebench -d strikebench_dev && exit 0
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Download the exact backend-tested jar
        uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: target

      - name: Verify packaged artifact identity
        run: node scripts/artifact-manifest.cjs verify target/strikebench.jar target/strikebench-artifact.json "$GITHUB_SHA" --require-clean

      - name: Install browser runtime
        working-directory: dom-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Includes the auth-on security contract (dom-auth.test.js), which drives a real OIDC
      # issuer against the packaged jar and is the private instance's only sign-in gate.
      - name: Packaged-jar journeys
        working-directory: dom-tests
        run: npm run test:journeys

      - name: Preserve journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-journeys
          path: target/dom-journeys.tap
          retention-days: 14

      - name: Preserve journey screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-journeys
          path: dom-tests/shots
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve journey process diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-journeys
          path: target/journey-diagnostics
          if-no-files-found: ignore
          retention-days: 14

  # Release evidence for the exact branch tip. The aggregator used to demand a TAP per SPA-era
  # lane — all deleted with workspace.html in 8654824 — so it could never succeed and CI simply
  # stopped producing evidence. It now sums the two meaningful browser lanes plus Surefire.
  release-evidence:
    needs: [backend, browser-contracts, browser-journeys]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse a summary for failed or cancelled upstream jobs
        env:
          UPSTREAM_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.UPSTREAM_RESULTS);
            const bad = Object.entries(jobs).filter(([, value]) => value.result !== "success");
            if (bad.length) {
              throw new Error(`release inputs did not all succeed: ${bad.map(([name, value]) =>
                `${name}=${value.result}`).join(", ")}`);
            }
          '
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: evidence-backend
          path: target/surefire-reports
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: evidence-contracts
          path: target
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: evidence-journeys
          path: target
      - name: Verify downloaded evidence layout
        run: |
          test -f target/surefire-reports/source.sha
          test -f target/dom-contracts.tap
          test -f target/dom-journeys.tap
          if test -e target/target; then
            echo "Evidence artifacts were downloaded under target/target instead of target." >&2
            find target/target -maxdepth 3 -type f -print >&2
            exit 1
          fi
      - name: Summarize
        run: |
          node scripts/release-matrix.mjs
          cat target/release-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-matrix
          path: |
            target/release-matrix.md
            target/dom-contracts.tap
            target/dom-journeys.tap
          retention-days: 14
