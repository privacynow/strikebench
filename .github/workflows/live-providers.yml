name: Live Provider Capture

on:
  workflow_dispatch:
  schedule:
    # 11:30 ET during daylight time / 10:30 ET during standard time, weekdays.
    - cron: '30 15 * * 1-5'

permissions:
  contents: read

concurrency:
  group: live-provider-capture
  cancel-in-progress: false

# This is a capture, not a gate, and the name now says so. The lane that asserted observed
# fail-closed states in the browser (dom-tests/dom-live.test.js, invoked as npm run test:live)
# was deleted with the SPA in 8654824, and nothing has replaced it; the aggregated
# `release-matrix.mjs --live-only` step went with it, since it reads the dom-live.tap that lane
# produced. Until a live journey suite exists (dom-tests/*.journey.test.js, run by lane.js), we
# record what the real keyless providers actually returned so an outage or an unavailable state
# can be read after the fact. Provider trouble is captured, not failed: only our own server
# failing to boot fails this job.
jobs:
  observed-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start isolated PostgreSQL
        run: |
          docker compose up -d db
          for attempt in {1..30}; do
            docker compose exec -T db pg_isready -U strikebench -d strikebench_dev && exit 0
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Package the jar under test
        run: mvn -q clean package -DskipTests

      # AppConfig defaults already point at the docker-compose database on 7070, and
      # FIXTURES_ONLY defaults to false, which is the whole point here: real providers.
      - name: Boot the packaged jar against real providers
        run: |
          nohup java -jar target/strikebench.jar > target/live-server.log 2>&1 &
          for attempt in {1..60}; do
            curl --silent --fail http://127.0.0.1:7070/api/health > /dev/null && exit 0
            sleep 2
          done
          cat target/live-server.log
          exit 1

      - name: Capture observed provider readiness
        env:
          SYMBOL: NVDA
          OUT_DIR: target/live-capture
        run: |
          scripts/live-market-probe.sh
          {
            echo '### Live provider capture'
            echo ''
            echo 'Raw HTTP status per read (a non-200 is a provider or fail-closed state, not a test failure):'
            echo ''
            echo '```'
            cat target/live-capture/http-status.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-capture-${{ github.run_id }}
          path: |
            target/live-capture
            target/live-server.log
          retention-days: 14
