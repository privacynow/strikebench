name: Live Provider Gate

on:
  workflow_dispatch:
  schedule:
    # 11:30 ET during daylight time / 10:30 ET during standard time, weekdays.
    - cron: '30 15 * * 1-5'

permissions:
  contents: read

concurrency:
  group: live-provider-gate
  cancel-in-progress: false

# This is the only workflow allowed to contact real market providers. It preserves every raw
# response for diagnosis and fails closed on transport, non-2xx, malformed JSON, or a response that
# violates the endpoint's typed semantic contract. Push/PR CI stays deterministic/provider-free.
jobs:
  observed-provider-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start isolated PostgreSQL
        run: |
          docker compose up -d db
          for attempt in {1..30}; do
            docker compose exec -T db pg_isready -U strikebench -d strikebench_dev && exit 0
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Package the jar under test
        run: |
          mvn -q clean package -DskipTests
          node scripts/artifact-manifest.cjs write

      # AppConfig defaults already point at the docker-compose database on 7070, and
      # FIXTURES_ONLY defaults to false, which is the whole point here: real providers.
      - name: Boot the packaged jar against real providers
        run: |
          nohup java -jar target/strikebench.jar > target/live-server.log 2>&1 &
          for attempt in {1..60}; do
            curl --silent --fail http://127.0.0.1:7070/api/health > /dev/null && exit 0
            sleep 2
          done
          cat target/live-server.log
          exit 1

      - name: Verify observed provider readiness
        env:
          SYMBOL: NVDA
          OUT_DIR: target/live-capture
        run: |
          probe_status=0
          scripts/live-market-probe.sh || probe_status=$?
          {
            echo '### Live provider gate'
            echo ''
            echo 'Raw HTTP status per read (transport, HTTP, JSON, and typed-contract failures fail this gate):'
            echo ''
            echo '```'
            cat target/live-capture/http-status.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$probe_status"

      - name: Preserve the capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-gate-${{ github.run_id }}
          path: |
            target/live-capture
            target/live-server.log
            target/strikebench-artifact.json
          retention-days: 14
