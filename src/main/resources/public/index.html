<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StrikeBench — Desk</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%232f6bde'/%3E%3Cstop%20offset='1'%20stop-color='%237c4fe0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='24'%20height='24'%20rx='6'%20fill='url(%23g)'/%3E%3Cpath%20d='M5%2019h14'%20stroke='rgba(255,255,255,.4)'%20stroke-width='1.2'%20stroke-linecap='round'%20stroke-dasharray='1.4%202.6'/%3E%3Cpath%20d='M5%2015.5h6l7.5-8.5'%20stroke='%23fff'%20stroke-width='2.2'%20fill='none'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='11'%20cy='15.5'%20r='1.9'%20fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css?v=@asset.version@">
</head>
<body>
<div id="app">
  <!-- ONE top row: left controls (home · new idea · mode) · a flex middle that shows the market strip
       at book and swaps to breadcrumb+state on zoom · a right symbol⇢sector⇢learn entry. Merges the
       old .thread + .pulse rows; mode is signalled ONCE by the strip's own source tag + tint. -->
  <div class="thread" id="thread">
    <button class="brandmk" id="brandHome" title="Your book"></button>
    <div class="thctl">
      <button class="btn pri xs threadnew" id="threadNewIdea">＋ New idea</button>
      <div class="mktmode" id="mktMode"><div class="mmseg">
        <button data-mkt="observed" class="on" title="Live market — Cboe option chains + candles when wired">● Observed</button><button data-mkt="sim" title="Demo market — synthetic, deterministic per seed; safe to experiment">◈ Simulated</button>
      </div></div>
    </div>
    <span class="thsep"></span>
    <div class="thctx" id="thctx">
      <div class="crumbs" id="crumbs"></div>
      <div class="tstate" id="threadState"></div>
      <div class="mktstrip" id="mktStrip"></div>
    </div>
    <div class="cmd">
      <div class="searchbox sm">
        <button class="cmdsym" id="cmdSym" title="focused underlying — click to search another" hidden>◎ <b></b></button>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="cmd" placeholder="symbol · sector · or learn — XOM · financials · iron condor · theta" autocomplete="off" spellcheck="false">
      </div>
      <!-- Who this book belongs to. Present only on a private instance: an open instance has no
           identity to show, and showing an empty one would imply a session that does not exist. -->
      <div class="whoami" id="whoami" hidden></div>
    </div>
  </div>

  <div id="stage" class="stagewrap lv-book">
    <div id="summary" class="summary"></div>
    <div id="board" class="board">
      <div id="recede" class="recede"></div>
      <div id="riskMain"></div>
      <div id="bookrisk"></div>
      <div id="chainBand"></div>
      <div id="activityBand" class="activityrail elegantscroll" aria-label="Positions and working ideas">
        <div id="book" class="book"></div>
        <div id="univBand"></div>
      </div>
      <div id="sectorBand"></div>
      <div id="newsBand"></div>
      <div id="focus" class="focus"></div>
      <div id="bookAuthState" class="bookauthority" hidden></div>
    </div>
  </div>
  <div id="decideStage" class="decstage" aria-hidden="true"></div>
  <div id="importStage" class="decstage" aria-hidden="true"></div>
  <div id="learnStage" class="decstage" aria-hidden="true"></div>
</div>
<div class="glosspop" id="glossPop"></div>

<div class="toast" id="toast"></div>

<!-- shared canonical data (no sprawl): the 60-strategy library + teaching content, also used by learn.html -->
<script src="strategies.js?v=@asset.version@"></script>
<script src="learn-shapes.js?v=@asset.version@"></script>
<script src="learn-content.js?v=@asset.version@"></script>
<script src="js/api.js?v=@asset.version@"></script>
<script src="js/desk-backend.js?v=@asset.version@"></script>
<script>
"use strict";
/* StrikeBench is a served application. The browser renders typed backend receipts; it does not
   contain an offline pricing, probability, payoff, Greeks, or simulation engine. */
var POS=[];
var byId={};

/* ---- MARKET STORIES ----
   Labels and glyphs are presentation. Every move, IV shift, elapsed session and valued result
   arrives in a backend receipt from the one ScenarioStory/Scenario Canvas policy. */
var SCEN=[
 {key:'MARKET_CRASH',n:'Market crash',s:'Crash',g:'M2 5 L9 4 L15 7 L21 6 L26 15 L33 19 L42 21'},
 {key:'GAP_DOWN',n:'Gap down',s:'Gap',g:'M2 6 L14 6 L16 15 L24 14 L32 16 L42 15'},
 {key:'ORDERLY_PULLBACK',n:'Orderly pullback',s:'Pullback',g:'M2 7 L10 10 L18 17 L26 18 L34 15 L42 13'},
 {key:'CHOPPY_SIDEWAYS',n:'Choppy / sideways',s:'Choppy',g:'M2 11 L8 5 L14 15 L20 7 L27 16 L34 8 L42 12'},
 {key:'FLAT_RANGE',n:'Flat / range',s:'Range',g:'M2 11 L10 10 L18 12 L26 10 L34 12 L42 11'},
 {key:'GRIND_HIGHER',n:'Grind higher',s:'Grind',g:'M2 17 L11 15 L20 12 L30 9 L42 6'},
 {key:'STRONG_RALLY',n:'Strong rally',s:'Rally',g:'M2 19 L10 17 L18 13 L27 9 L35 6 L42 3'},
 {key:'MELT_UP',n:'Melt-up',s:'Melt-up',g:'M2 20 L11 18 L19 16 L27 11 L34 7 L42 2'}
];
function scenData(p){
  /* One source for every surface: exact engine-priced checkpoints. The browser neither fills
     missing story moves nor ranks a synthetic "best"/"median" from another receipt. */
  var heldTrade=p&&p.isHeld&&p._trade||null;
  var risk=p&&p.evaluation&&p.evaluation.risk||heldTrade||{};
  var scenarioReceipt=risk&&risk.scenarios,
      src=heldTrade
        ?scenarioReceipt&&scenarioReceipt.available===true&&Array.isArray(scenarioReceipt.values)
          ?scenarioReceipt.values:[]
        :Array.isArray(scenarioReceipt)?scenarioReceipt:[],
      unavailableReason=heldTrade&&scenarioReceipt&&scenarioReceipt.available===false
        ?scenarioReceipt.unavailableReason:null,
      anchorCents=authNumber(scenarioReceipt&&scenarioReceipt.anchorSpotCents),
      anchorSpot=anchorCents==null?null:authDollarsFromCents(anchorCents),
      anchor={spot:anchorSpot,spotCents:anchorCents,
        basis:scenarioReceipt&&scenarioReceipt.anchorBasis||null,
        freshness:scenarioReceipt&&scenarioReceipt.freshness||null,
        source:scenarioReceipt&&scenarioReceipt.source||null,
        observedAt:authNumber(scenarioReceipt&&scenarioReceipt.observedAt)};
  var rows=src.map(function(row){
    var move=authNumber(row.underlyingMovePct),pl=authDollarsFromCents(row.pnlCents),
        targetSpotCents=heldTrade?authNumber(row.targetUnderlyingCents):null;
    if(move==null||pl==null)return null;
    var m=move*100,storyKey=String(row.story||''),si=SCEN.findIndex(function(story){
      return story.key===storyKey;
    });
    if(si<0)return null;
    if(heldTrade&&targetSpotCents==null)return null;
    return {i:si,s:SCEN[si],m:m,pl:pl,prob:authNumber(row.prob),
      targetSpotCents:targetSpotCents};
  }).filter(Boolean).sort(function(a,b){return a.m-b.m;});
  if(!rows.length)return {rows:[],worst:null,unavailable:true,anchor:anchor,
    unavailableReason:unavailableReason||'Named scenario values are unavailable.'};
  var worstReceipt=risk&&risk.worstScenario||null,worstMove=worstReceipt&&worstReceipt.severityAvailable===true
    ?authNumber(worstReceipt.underlyingMovePct):null;
  var worst=worstMove==null?null:rows.find(function(row){return Math.abs(row.m-worstMove*100)<.0001;})||null;
  return {rows:rows,worst:worst,anchor:anchor};
}

/* ---- animation config ---- */
var DUR=340, EASE='cubic-bezier(.22,.68,.28,1)';
var reduce=false;
try{ reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(e){}

/* ---- state = one zoom axis + one focus ---- */
var LEVELS=['book','position'];   /* market + sector are now folded INTO Home (book), not separate zoom levels */
var state={level:'book', focus:POS.length?POS[0].id:null};
var BOOK_AUTH={phase:'loading',data:null,missing:[],error:null,requestId:0};
/* ---- element handles ---- */
var stageEl, boardEl, bookEl, recedeEl, focusEl, summaryEl, crumbsEl, cmdEl, toastEl;
var cardEl={};

/* ======================================================================
   PAYOFF — draw the server-owned terminal-payoff receipt.
   ====================================================================== */
function payDomain(p){
  return p&&Array.isArray(p.payoffPoints)&&p.payoffPoints.length
    ?[p.payoffPoints[0].price,p.payoffPoints[p.payoffPoints.length-1].price]:null;
}
function pfTicks(lo,hi,count){
  var span=hi-lo; if(span<=0)return[lo];
  var step=Math.pow(10,Math.floor(Math.log(span/count)/Math.LN10)), err=(span/count)/step;
  if(err>=7.5)step*=10; else if(err>=3.5)step*=5; else if(err>=1.5)step*=2;
  var out=[]; for(var v=Math.ceil(lo/step)*step; v<=hi+1e-6; v+=step) out.push(Math.round(v*1e6)/1e6);
  return out;
}
function fmtK(a){var s=a<0?'−':''; a=Math.abs(a); return s+(a>=1000?(Math.round(a/100)/10)+'k':''+Math.round(a));}
function breakevens(p){
  return p&&Array.isArray(p.breakevens)?p.breakevens.map(Number).filter(Number.isFinite):[];
}
/* A break-even is a PRICE. Rounding it to whole dollars made New Idea state a materially coarser
   level than the Position built from the same receipt ("217" against "$217.16"). */
function beLabel(p){var b=breakevens(p); if(!b.length)return '—'; return b.slice(0,2).map(priceLevel).join(' · ');}

/* shared fan/scale PRIMITIVES for the four fan drawers (payoff / MC / book / position-paths) and the
   path hit-tests. ONE definition each; callers keep their own distinct domains + number format.
   fanY is the inverted linear Y scale — only the position-paths Y reduces to it bit-for-bit; the
   book/MC/payoff Y-scales evaluate the same algebra in a different (non-associative) float order and
   stay inline. fanX clamps x to [0,horizon] only when asked (paths yes, book no). fanPathD builds a
   polyline: map/join(' ') style == concat with first='M' sep=' L'; paths' spaced style == 'M ' / ' L '. */
/* Clamped to the plot box: a value beyond the band-owned domain draws pinned at the edge —
   "exits the range" — rather than painting over the header or the axis. */
function fanY(v,y0,y1,lo,hi){return Math.max(y0,Math.min(y1,y1-(y1-y0)*(v-lo)/(hi-lo)));}
function fanX(day,x0,x1,horizon,clamp){var d=clamp?Math.max(0,Math.min(horizon,Number(day))):day;return x0+(x1-x0)*d/horizon;}
function fanPathDay(i,path,progress,horizon){
  var day=Array.isArray(progress)&&progress.length===path.length?authNumber(progress[i]):null;
  return day;
}
function fanPathD(pts,fx,fy,first,sep){var d='';for(var i=0;i<pts.length;i++)d+=(i?sep:first)+fx(pts[i],i).toFixed(1)+' '+fy(pts[i],i).toFixed(1);return d;}
function fanSampleAt(path,day,progress,horizon){
  if(!Array.isArray(path)||!path.length||!Array.isArray(progress)||progress.length!==path.length)return null;
  var firstDay=authNumber(progress[0]),firstValue=authNumber(path[0]);
  if(firstDay==null||firstValue==null)return null;
  if(day<=firstDay)return firstValue;
  for(var i=1;i<progress.length;i++){
    var right=authNumber(progress[i]),left=authNumber(progress[i-1]),
        rightValue=authNumber(path[i]),leftValue=authNumber(path[i-1]);
    if(right==null||left==null||rightValue==null||leftValue==null)return null;
    if(day<=right){var f=right===left?0:(day-left)/(right-left);return authLerp(leftValue,rightValue,Math.max(0,Math.min(1,f)));}
  }
  return authNumber(path[path.length-1]);
}
function drawPayoff(svg,p,full,ghost,opts){
  if(!svg)return; opts=opts||{};
  if(!p||!Array.isArray(p.payoffPoints)||p.payoffPoints.length<2){
    var emptyW=Math.max(40,Math.round(svg.clientWidth||(full?520:170))),emptyH=Math.max(24,Math.round(svg.clientHeight||(full?260:46)));
    svg.setAttribute('viewBox','0 0 '+emptyW+' '+emptyH);svg._map=null;
    svg.innerHTML='<line x1="8" y1="'+(emptyH/2).toFixed(1)+'" x2="'+(emptyW-8)+'" y2="'+(emptyH/2).toFixed(1)+'" stroke="var(--line-soft)" stroke-dasharray="3 5"/>'+
      (full?'<text x="'+(emptyW/2).toFixed(1)+'" y="'+(emptyH/2-9).toFixed(1)+'" text-anchor="middle" fill="var(--dim)" font-size="11">Payoff checkpoints loading</text>':'');
    return;
  }
  var W=Math.max(40,Math.round(svg.clientWidth||(full?520:170)));
  var H=Math.max(24,Math.round(svg.clientHeight||(full?260:46)));
  var compactHero=full&&(H<145||(p.isHeld&&H<240));
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var dom=payDomain(p), lo=dom[0], hi=dom[1];
  var mL=full?56:3, mR=full?18:3, mT=full?(compactHero?16:22):5, mB=full?(compactHero?32:38):5;
  var x0=mL, x1=W-mR, y0=mT, y1=H-mB, pw=x1-x0, ph=y1-y0;
  /* Draw the supplied polyline directly. Resampling it in the browser created a second payoff
     series and made later code accidentally treat interpolated pixels as engine facts. */
  var pts=p.payoffPoints.map(function(point){return [Number(point.price),Number(point.profit)];})
    .filter(function(point){return Number.isFinite(point[0])&&Number.isFinite(point[1]);});
  if(pts.length<2){svg._map=null;svg.innerHTML='';return;}
  /* The recorded terminal curve remains valid when today's quote or executable option book is
     absent. Use its backend anchor for scale/ticks, but draw a "now" rail only when a current
     underlying receipt actually exists. */
  var currentSpot=authNumber(p.spot),
      recordedAnchor=p.terminalPayoff&&p.terminalPayoff.anchorSpotCents!=null
        ?authDollarsFromCents(p.terminalPayoff.anchorSpotCents):null,
      axisSpot=currentSpot!=null?currentSpot:recordedAnchor!=null?recordedAnchor:(lo+hi)/2;
  var profits=pts.map(function(point){return point[1];}),vmin=Math.min.apply(0,profits),vmax=Math.max.apply(0,profits);
  /* vmin/vmax drive the max-profit/loss plateau labels; the drawn Y-DOMAIN also includes
     the current mark P/L so the "now" mark dot always lands on-chart (e.g. MU's mark sits
     above the curve's at-expiry cap). */
  var displayedMarkPnl=typeof p.pnl==='number'?p.pnl:
        typeof p.indicativePnl==='number'?p.indicativePnl:null,
      displayedMarkIndicative=typeof p.pnl!=='number'&&typeof p.indicativePnl==='number',
      yDomLo=vmin, yDomHi=vmax;
  if(full&&displayedMarkPnl!=null){
    yDomLo=Math.min(yDomLo,displayedMarkPnl); yDomHi=Math.max(yDomHi,displayedMarkPnl);
  }
  var padY=(yDomHi-yDomLo)*0.18||100, yLo=yDomLo-padY, yHi=yDomHi+padY;
  function sx(px){return x0+(px-lo)/(hi-lo)*pw;}
  function sy(v){return y1-(v-yLo)/(yHi-yLo)*ph;}
  function f(v){return Math.round(v*10)/10;}
  function hx(v){return Math.round(v)+0.5;}
  var zY=sy(0), uid=p.id.replace(/[^a-z0-9]/gi,'')+(full?'F':'S'), g='';
  g+='<defs>';
  g+='<linearGradient id="gp'+uid+'" x1="0" y1="'+y0+'" x2="0" y2="'+zY+'" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--profit)" stop-opacity=".28"/><stop offset="1" stop-color="var(--profit)" stop-opacity=".02"/></linearGradient>';
  g+='<linearGradient id="gl'+uid+'" x1="0" y1="'+zY+'" x2="0" y2="'+y1+'" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--loss)" stop-opacity=".02"/><stop offset="1" stop-color="var(--loss)" stop-opacity=".24"/></linearGradient>';
  g+='<clipPath id="cp'+uid+'"><rect x="'+x0+'" y="'+y0+'" width="'+pw+'" height="'+Math.max(0,zY-y0)+'"/></clipPath>';
  g+='<clipPath id="cl'+uid+'"><rect x="'+x0+'" y="'+zY+'" width="'+pw+'" height="'+Math.max(0,y1-zY)+'"/></clipPath>';
  g+='</defs>';
  var line=''; for(var i=0;i<pts.length;i++) line+=(i?' L ':'M ')+f(sx(pts[i][0]))+' '+f(sy(pts[i][1]));
  var area=line+' L '+f(sx(pts[pts.length-1][0]))+' '+f(zY)+' L '+f(sx(pts[0][0]))+' '+f(zY)+' Z';
  g+='<path d="'+area+'" fill="url(#gp'+uid+')" clip-path="url(#cp'+uid+')"/>';
  g+='<path d="'+area+'" fill="url(#gl'+uid+')" clip-path="url(#cl'+uid+')"/>';
  if(full){
    var authYTicks=pfTicks(yLo,yHi,4);
    for(var ayi=0;ayi<authYTicks.length;ayi++){var ayt=authYTicks[ayi],ayy=sy(ayt);if(ayy<y0-1||ayy>y1+1)continue;
      if(Math.abs(ayt)>1e-6)g+='<line x1="'+hx(x0)+'" y1="'+hx(ayy)+'" x2="'+hx(x1)+'" y2="'+hx(ayy)+'" stroke="var(--line-soft)" stroke-width="1"/>';
      g+='<text class="pfax" x="'+(x0-7)+'" y="'+f(ayy+3)+'" text-anchor="end">'+(ayt>0?'+$':ayt<0?'−$':'$')+fmtK(Math.abs(ayt))+'</text>';}
  }
  g+='<line x1="'+hx(x0)+'" y1="'+hx(zY)+'" x2="'+hx(x1)+'" y2="'+hx(zY)+'" stroke="var(--line)" stroke-width="1"/>';
  if(full){
    if(p.maxProfit!=null&&Number(p.maxProfit)>0&&Number(p.maxProfit)>=yLo&&Number(p.maxProfit)<=yHi){var yy=sy(Number(p.maxProfit)); g+='<line x1="'+hx(x0)+'" y1="'+hx(yy)+'" x2="'+hx(x1)+'" y2="'+hx(yy)+'" stroke="var(--profit)" stroke-dasharray="1 3" opacity=".5"/>';
      if(!opts.labelRails)g+='<text class="pfplat pfp" x="'+(x1-3)+'" y="'+f(yy-5)+'" text-anchor="end">'+profitAmount(Number(p.maxProfit))+' max</text>';}
    if(p.maxLoss!=null&&Number(p.maxLoss)>0&&-Number(p.maxLoss)>=yLo&&-Number(p.maxLoss)<=yHi){var yy=sy(-Number(p.maxLoss)); g+='<line x1="'+hx(x0)+'" y1="'+hx(yy)+'" x2="'+hx(x1)+'" y2="'+hx(yy)+'" stroke="var(--loss)" stroke-dasharray="1 3" opacity=".5"/>';
      if(!opts.labelRails)g+='<text class="pfplat pfl" x="'+(x1-3)+'" y="'+f(yy+12)+'" text-anchor="end">'+lossAmount(Number(p.maxLoss))+' max</text>';}
    for(var i=0;i<p.legs.length;i++){var l=p.legs[i]; if(l.t==='s')continue; var k=l.k; if(k<lo||k>hi)continue; var kx=sx(k);
      g+='<path d="M '+f(kx-3.5)+' '+y1+' L '+f(kx+3.5)+' '+y1+' L '+f(kx)+' '+f(y1-5)+' Z" fill="var(--dim)"/>';
    }
    var sX=sx(axisSpot);
    g+='<line x1="'+hx(sX)+'" y1="'+y0+'" x2="'+hx(sX)+'" y2="'+y1+'" stroke="'+
      (currentSpot==null?'var(--dim)':'var(--text)')+'" stroke-dasharray="2 3" opacity=".33"/>';
    if(!compactHero&&!opts.labelRails) g+='<text class="pflab" x="'+f(sX)+'" y="'+(y0-6)+'" text-anchor="middle">'+
      (currentSpot==null?'recorded ':'now ')+Math.round(axisSpot)+'</text>';
    var pLo=(lo/axisSpot-1)*100, pHi=(hi/axisSpot-1)*100, xt=pfTicks(pLo,pHi,5);
    for(var i=0;i<xt.length;i++){var pc=xt[i], px=axisSpot*(1+pc/100), X=sx(px); if(X<x0-1||X>x1+1)continue;
      g+='<text class="pfpx" x="'+f(X)+'" y="'+(y1+16)+'" text-anchor="middle">'+Math.round(px)+'</text>';
      g+='<text class="pfpct" x="'+f(X)+'" y="'+(y1+30)+'" text-anchor="middle">'+(pc>0?'+':'')+(Math.round(pc*10)/10)+'%</text>';}
    var bes=breakevens(p);
    for(var bi=0;bi<bes.length;bi++){var bx=bes[bi]; if(bx<lo||bx>hi)continue; var bX=sx(bx);
      g+='<line x1="'+hx(bX)+'" y1="'+y0+'" x2="'+hx(bX)+'" y2="'+y1+'" stroke="var(--caution)" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>';
      if(!opts.labelRails)g+='<text class="pfbe" x="'+f(bX)+'" y="'+f(Math.min(zY-5,y1-6))+'" text-anchor="middle">B/E '+priceLevel(bx)+'</text>';}
  }
  if(full) g+='<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity=".13"/>';
  g+='<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="'+(full?2.25:1.6)+'" stroke-linejoin="round" stroke-linecap="round"/>';
  if(full){
    /* Named stories carry exact backend P/L checkpoints. Their x coordinate is a chart transform
       of the supplied move and anchor spot; the displayed amount is never interpolated. */
    var scenarioData=scenData(p),scenarioRows=scenarioData.rows||[],
        scenarioAnchor=scenarioData.anchor&&scenarioData.anchor.spot;
    if(!opts.hideScenarios)for(var si=0;si<scenarioRows.length;si++){var story=scenarioRows[si],
      spx=story.targetSpotCents==null
        ?(scenarioAnchor==null?axisSpot:scenarioAnchor)*(1+story.m/100)
        :authDollarsFromCents(story.targetSpotCents);
      if(spx<lo||spx>hi)continue;
      var sv=story.pl;if(sv==null)continue;
      var scx=sx(spx),scy=sy(sv),scol=sv>=0?'var(--profit)':'var(--loss)';
      g+='<circle class="pfscen" data-si="'+story.i+'" cx="'+f(scx)+'" cy="'+f(scy)+'" r="3.4" fill="var(--panel)" stroke="'+scol+'" stroke-width="1.4"/>';}
    /* A pinned marker uses one exact server frame. The base curve is an EXPIRATION payoff, so an
       intermediate modeled mark must never be plotted on its P/L axis as though it were terminal.
       During playback the hero follows only the supplied underlying price rail; the exact P/L dot
       appears when the backend lifecycle boundary says the package has reached its terminal frame. */
    var pinFrame=!opts.hideScenarios&&p.id in pinnedScen?authoritativeFrame(p,scenSt(p.id).t):null;
    if(pinFrame&&pinFrame.price!=null&&pinFrame.pnl!=null){var pmag=pinFrame.move,ppx=pinFrame.price,pv=pinFrame.pnl;

    symbol:position?position.sym:WORKSPACE.focusedSymbol,

  decideEl.classList.remove('composeonly');
  if(decide.kind==='close'){ renderClose(); wireDecide(); return; }
  var c=activeCand();
  if(!c&&decide.kind==='idea'&&decide.backendPhase==='underlying-required'){renderUnderlyingRequired();wireDecide();return;}
  if(!c&&deskBackendEnabled()&&decide.kind==='idea'&&decide.backendPhase==='declaration-required'){renderAuthoritativeDeclarationRequired();wireDecide();return;}
  if(!c&&deskBackendEnabled()&&decide.kind==='idea'&&decide.backendPhase==='strategy-empty'){renderAuthoritativeEmpty();wireDecide();return;}
  if(!c&&deskBackendEnabled()&&decide.kind==='idea'&&decide.backendPhase==='comparison-required'){renderComparisonRequired();wireDecide();return;}
  if(!c&&deskBackendEnabled()&&decide.kind==='idea'&&decide.backendPhase==='adoption-unavailable'){renderAdoptionUnavailable();wireDecide();return;}
  if(!c&&deskBackendEnabled()&&decide.kind==='idea'){renderAuthoritativePending();wireDecide();return;}
  /* Most Decide actions (inspect, order, review, intent, picker typing) do not change the
     scenario artifact. Detach and re-seat that exact subtree so playback, focus, and controls
     retain identity instead of flashing every time another part of the screen updates. */
  var oldScen=decideEl.querySelector('.scenpanel'), keepScen=null, skey=scenSurfaceKey(c);
  if(oldScen&&oldScen.getAttribute('data-scen-key')===skey){ keepScen=oldScen; oldScen.parentNode.removeChild(oldScen); }
  var execHtml=decExecute(c);
  var densityClass=(decide.cands||[]).length<=3?' few-ideas':'';
  var packageClass=(c.legs||[]).length<=4?' canonical-package':'';
  decideEl.innerHTML='<div class="decwrap">'+decTop(c)+
    '<div class="decgrid'+densityClass+packageClass+'">'+leftCol(c)+centerCol(c)+rightCol(c)+'</div>'+
    '<div class="decdock'+(decide.order.review?' reviewdock':'')+(execHtml?'':' empty')+'"><span></span>'+execHtml+'</div>'+
  '</div>';
  if(keepScen){ var freshScen=decideEl.querySelector('.scenpanel'); if(freshScen)freshScen.parentNode.replaceChild(keepScen,freshScen); }
  refreshDecScenHeader(c);
  drawPayoff(decideEl.querySelector('#decPay'), c, true, null, {pinM:scrubMag(c)});
  if(document.getElementById('decMap')) drawDecMap();
  drawFanIcons();
  wireDecide();
  /* The fan's SVG is rebuilt with the surface. Draw it only after that surface owns its final
     dimensions; drawing synchronously here measured the detached/replaced node and left a newly
     selected package with an empty, otherwise correctly sized fan. */
  window.requestAnimationFrame(function(){
    syncCandidateOverflow();
    drawDecMarketHist();
    if(decide&&decide.mcOn)drawMCFan();
  });
}

function decStep(kind,d){
  if(kind==='qty') decide.order.qty=Math.max(1,Math.min(20,decide.order.qty+d));
  else if(kind==='price'&&decide.order.type==='limit'){
    /* Stepping from zero manufactured a committable ±$0.25 package limit out of nothing. With no
       valuation to step from there is no price to nudge — say so and leave the field empty. */
    var base=estPrice();
    if(base==null||!Number.isFinite(Number(base))){
      toast('No executable valuation for this package yet — there is no price to step from.');
      return;
    }
    decide.order.price=Math.round((Number(base)+d*.25)*100)/100; }
  decide.order.acknowledged={};
  if(authoritativeCandidate())queueOrderPreview(); else renderDecide();
}

function nearestBackendStrike(type,target){
  var catalog=backendDraftCatalog(), rows=catalog&&(type==='c'?catalog.calls:catalog.puts)||[];
  if(!rows.length)return null;

function steppedBackendStrike(leg,direction){
  var catalog=backendDraftCatalog(), rows=catalog&&(leg.t==='c'?catalog.calls:catalog.puts)||[];
  if(!rows.length)return leg.k;
  var at=rows.indexOf(Number(leg.k));

function legAction(act,i,d){
  /* editing any leg (a stepper here, or a strike drag on the chart) forks the engine pick
     into your own build — the structure IS the editor, no separate mode to hunt for */
  if(decide.mode!=='build'){ var eng=activeCand(); decide.buildLegs=eng.legs.map(cloneDecisionLeg); decide.buildSourceId=eng.id; decide.mode='build'; }
  var L=decide.buildLegs; if(!L)return;
  if(act==='rm'){if(L[i]&&L[i].t!=='s')L.splice(i,1);}
  else {var exact=L[i];if(!exact)return;
    if(act==='side')exact.q=-exact.q;
    else if(act==='type'&&exact.t!=='s'){
      exact.t=exact.t==='c'?'p':'c';exact.type=exact.t==='c'?'CALL':'PUT';
      var snapped=nearestBackendStrike(exact.t,exact.k);if(snapped!=null){exact.k=snapped;exact.strike=snapped;}
      clearLegQuote(exact);   /* different contract — the old capture must not display against it */
    } else if(act==='strike'&&exact.t!=='s'){
      exact.k=steppedBackendStrike(exact,d);exact.strike=exact.k;
      clearLegQuote(exact);
    } else if(act==='qty'){
      var exactSign=exact.q<0?-1:1,step=exact.t==='s'?100:1,min=exact.t==='s'?100:1;
      exact.q=exactSign*Math.max(min,Math.abs(exact.q)+d*step);

  }
  renderAfterDecisionChange();
}

/* ======================================================================

   The desk used to hold four invented brokerage rows and price them in the browser; the served
   build could not use them at all, so the button did a full page navigation to a hash left over
   from the deleted SPA. That reload was what wiped the declaration and the world indicator
   (audit §5.6): the whole workspace lived in memory, and the page was thrown away.

   Now it is one overlay over ONE backend journey — paste → preview → confirm. The server parses
   the statement, marks each package EXACT FILLS or PACKAGE NET, and writes only the groups the
   user selected; groups that report a package net without per-leg prices go to the pending

function importReadable(){return !!(imp.broker&&String(imp.text||'').trim().length>0);}
function runImportPreview(){
  if(!importReadable()||imp.busy)return;

  window.DeskBackend.previewBrokerImport({sourceSystem:imp.broker,sourceAccount:imp.account||null,text:imp.text})
    .then(function(preview){
      imp.busy=false;imp.preview=preview;imp.phase='previewed';
      /* Exact-fill groups start selected because they are complete; a package-net group is an
         explicit choice to quarantine, so the user opts in to it. */
      imp.selected={};
      (preview&&preview.parsed&&preview.parsed.groups||[]).forEach(function(g){
        imp.selected[g.groupKey]=g.kind==='EXACT_FILLS';
      });
      refreshImport();
    }).catch(function(error){
      imp.busy=false;imp.phase='idle';
      imp.error=error&&error.message||'The statement could not be read.';refreshImport();

function runImportConfirm(){
  var groups=importSelectedGroups(); if(!groups.length||imp.busy)return;
  var parsed=imp.preview&&imp.preview.parsed||{};

  window.DeskBackend.confirmBrokerImport({
    previewFingerprint:parsed.previewFingerprint,sourceSystem:imp.broker,
    sourceAccount:imp.account||null,text:imp.text,
    destinationAccountByFingerprint:imp.destination,
    groups:groups.map(function(g){return {groupKey:g.groupKey,legs:g.legs.map(importVerifiedLeg)};})
  }).then(function(result){
    imp.busy=false;imp.result=result;imp.phase='confirmed';refreshImport();
    if(window.DeskBackend.loadBook)window.DeskBackend.loadBook().catch(function(){});
  }).catch(function(error){
    imp.busy=false;imp.error=error&&error.message||'The import could not be confirmed.';refreshImport();
  });
}
/* The user's verification is an acknowledgement of what the server parsed — never a re-statement
   of it. Every field is echoed back exactly as parsed; only `acknowledgeInferred` is ours. */

  return {legNo:leg.legNo,instrumentType:leg.instrumentType,action:leg.action,
    positionEffect:leg.positionEffect,symbol:leg.symbol,optionType:leg.optionType,
    strike:leg.strike,expiration:leg.expiration,quantity:leg.quantity,multiplier:leg.multiplier,
    acknowledgeInferred:importLegInferred(leg)};

    if(broker){ imp.broker=broker.getAttribute('data-imp-broker'); imp.preview=null; imp.result=null; refreshImport(); return; }
    var group=t.closest('[data-imp-group]');
    if(group){ var key=group.getAttribute('data-imp-group'); imp.selected[key]=!imp.selected[key]; refreshImport(); return; }

    if(t.matches('[data-imp-text]')){imp.text=t.value;imp.preview=null;imp.result=null;refreshImport();}

  var grk=(s.grk||[]).map(function(gk){return '<span class="lgrk">'+gk[0]+' '+gk[1]+'</span>';}).join(''),cap=learnCapability(s);
  return '<div class="lexpl"><div class="lexpl-h"><b>'+s.nm+'</b><span class="badge '+(s.badge||'ok')+'">'+(s.badgeTxt||'')+'</span></div>'+
    (cap?'<div class="learncap '+cap.cls+'"><b>'+deskEsc(cap.label)+'</b><span>'+deskEsc(cap.detail)+'</span></div>':'')+
    '<div class="lexpl-tag">'+glossWrap(s.tag||'')+'</div>'+
    '<div class="lexpl-chips">'+chips+(grk?'<span class="lgrks" title="Typical setup only; the exact package Greeks are authoritative"><span class="lgrk">Typical sensitivities</span>'+grk+'</span>':'')+'</div>'+
    '<svg class="lexpl-pay" role="img" aria-label="Qualitative payoff shape at expiration"></svg>'+
    '<p class="lexpl-beg">'+glossWrap(s.beg||'')+'</p>'+
    (s.more?'<div class="callout bare"><span class="xt">The mechanics</span>'+glossWrap(s.more)+'</div>':'')+'</div>'; }
function conceptCardHTML(c,big){ if(!c)return ''; return '<div class="lconcept'+(big?' big':'')+'" data-concept="'+c.h.toLowerCase()+'"><div class="lc-h"><span class="lci"><svg viewBox="0 0 24 24">'+c.icon+'</svg></span><b>'+c.h+'</b></div><p>'+glossWrap(c.p)+'</p>'+(big?'<div class="callout bare"><span class="xt">The mechanics</span>'+glossWrap(c.x)+'</div>':'')+'</div>'; }
function glossItemHTML(t){ return '<div class="lgi" data-k="'+(t.t+' '+(t.alias||'')+' '+(t.k||'')).toLowerCase().replace(/"/g,'')+'"><div class="lgi-h"><b>'+t.t+'</b>'+(t.alias?'<span class="ga">'+t.alias+'</span>':'')+'<span class="lgi-cat">'+t.cat+'</span></div><div class="lgi-def">'+glossWrap(t.def)+'</div></div>'; }
function renderLearn(seed){
  var lead='';
  if(seed&&seed.type==='strat'){ lead=strategyExplainerHTML(seed.s); }
  else if(seed&&seed.type==='term'){ var t=seed.t; lead='<div class="lexpl"><div class="lexpl-h"><b>'+t.t+'</b>'+(t.alias?'<span class="ga">'+t.alias+'</span>':'')+'<span class="badge">'+t.cat+'</span></div><div class="lexpl-tag">'+t.def+'</div><div class="callout bare"><span class="xt">Under the hood</span>'+glossWrap(t.x)+'</div></div>'; }
  else if(seed&&seed.type==='concept'){ lead=conceptCardHTML(seed.c,true); }
  return '<div class="ovwrap lrn"><div class="dectop"><button class="dback" data-learn-act="back">← Back</button>'+
      '<div class="decttl">Learn<span class="dctx"> · concepts · strategies · terms</span></div>'+
      '<div class="lsearch"><input id="learnq" placeholder="what to understand? — theta · iron condor · gap risk" autocomplete="off" spellcheck="false"></div></div>'+
    '<div class="lrn-body">'+
      (lead?'<div class="lsec lead">'+lead+'</div>':'')+
      '<div class="lsec"><div class="lsec-h"><span class="eyebrow">Concepts</span></div><div class="lconcepts">'+LEARN_C.map(function(c){return conceptCardHTML(c,false);}).join('')+'</div></div>'+
      '<div class="lsec"><div class="lsec-h"><span class="eyebrow">Glossary</span><span class="hint">'+LEARN_G.length+' terms · type above to filter</span></div><div class="lgloss" id="lglossList">'+LEARN_G.map(glossItemHTML).join('')+'</div></div>'+
    '</div></div>'; }
function mountLearn(seed,focusSearch,query){
  learnEl.innerHTML=renderLearn(seed);
  if(seed&&seed.type==='strat'){
    var sv=learnEl.querySelector('.lexpl-pay');
    if(sv)drawLearnPay(sv,LEARN_SHAPES[seed.s.nm]);
  }
  var q=document.getElementById('learnq'); if(q){ q.oninput=function(){ filterLearn(q.value); }; if(query){q.value=query;filterLearn(query);} if(focusSearch&&!reduce)window.setTimeout(function(){q.focus();},80); }
}
function openLearn(seed,origin){ learnEl=learnEl||document.getElementById('learnStage'); if(!learnEl)return;
  learnOpen=true;learnO._origin=origin||null;learnO._seed=seed||null;mountLearn(seed,true);overlayShow(learnEl,origin);
  learnEl.onclick=function(e){ var b=e.target.closest('[data-learn-act]'); if(b&&b.getAttribute('data-learn-act')==='back'){ closeLearn(); return; }
    var g=e.target.closest('.gloss[data-term]'); if(g){ var gt=GBY[g.getAttribute('data-term').toLowerCase()]; if(gt)openLearn({type:'term',t:gt}, g.getBoundingClientRect()); return; }
    var cc=e.target.closest('[data-concept]'); if(cc){ var c=CBY[cc.getAttribute('data-concept')]; if(c&&!e.target.closest('.big'))openLearn({type:'concept',c:c}, cc.getBoundingClientRect()); return; } };
  if(!LEARN_CAP_DOC&&window.DeskBackend&&typeof DeskBackend.strategyCatalog==='function'){
    DeskBackend.strategyCatalog().then(function(doc){if(!doc)return;LEARN_CAP_DOC=doc;if(learnOpen){var q=document.getElementById('learnq');mountLearn(learnO._seed,false,q&&q.value);}});
  }
}
function closeLearn(){ if(!learnOpen)return; learnOpen=false; overlayHide(learnEl, learnO._origin); }
function filterLearn(q){ q=(q||'').trim().toLowerCase(); if(!learnEl)return;
  var items=learnEl.querySelectorAll('#lglossList .lgi'); for(var i=0;i<items.length;i++){ items[i].style.display=(!q||items[i].getAttribute('data-k').indexOf(q)>=0)?'':'none'; } }
/* command-bar learn entry: 'learn X' / a bare term / strategy / concept → the lens seeded on it */
function learnResolve(q){ q=(q||'').trim().toLowerCase().replace(/^(learn|what ?is|explain|define|teach me)\s+/,''); if(!q){ openLearn(null,null); return true; }
  var s=SBY[q]||learnStrat(q); if(s){ openLearn({type:'strat',s:s},null); return true; }
  if(GBY[q]){ openLearn({type:'term',t:GBY[q]},null); return true; }
  if(CBY[q]){ openLearn({type:'concept',c:CBY[q]},null); return true; }
  var k=glossKeys().filter(function(x){return x.indexOf(q)>=0;})[0]; if(k){ openLearn({type:'term',t:GBY[k]},null); return true; }
  /* multi-word: every word must appear in the term's/concept's searchable text */
  var words=q.split(/\s+/).filter(Boolean);
  var gt=LEARN_G.filter(function(t){ var hay=(t.t+' '+(t.alias||'')+' '+(t.k||'')).toLowerCase(); return words.every(function(w){return hay.indexOf(w)>=0;}); })[0];
  if(gt){ openLearn({type:'term',t:gt},null); return true; }
  var sf=STRATS.filter(function(x){return (x.nm||'').toLowerCase().indexOf(q)>=0;})[0]; if(sf){ openLearn({type:'strat',s:sf},null); return true; }
  var cf=LEARN_C.filter(function(c){ var hay=((c.k||'')+' '+c.h).toLowerCase(); return words.every(function(w){return hay.indexOf(w)>=0;}); })[0]; if(cf){ openLearn({type:'concept',c:cf},null); return true; }
  return false; }
/* the glossary hover popover — one singleton, reads GBY, never a route */
function wireGloss(){ var pop=document.getElementById('glossPop'); if(!pop||pop._wired)return; pop._wired=1;
  document.addEventListener('mouseover',function(e){ var g=e.target.closest&&e.target.closest('.gloss[data-term]'); if(!g)return;
    var t=GBY[g.getAttribute('data-term').toLowerCase()]; if(!t)return;
    pop.innerHTML='<b>'+t.t+'</b>'+(t.alias?' <span class="ga">'+t.alias+'</span>':'')+'<div class="gpd">'+t.def+'</div><div class="gph">click to open in Learn</div>';
    var r=g.getBoundingClientRect(); pop.style.display='block';
    var pw=pop.offsetWidth,ph=pop.offsetHeight,left=Math.max(6,Math.min(window.innerWidth-pw-6,r.left));
    var top=r.bottom+7; if(top+ph>window.innerHeight-6)top=Math.max(6,r.top-ph-7);
    pop.style.left=left+'px'; pop.style.top=top+'px'; void pop.offsetWidth; pop.classList.add('on'); });
  document.addEventListener('mouseout',function(e){ var g=e.target.closest&&e.target.closest('.gloss[data-term]'); if(g){ pop.classList.remove('on'); pop.style.display='none'; } }); }

/* ---- Identity gate -------------------------------------------------------------------
   A private instance answers every protected read with 401. Without a gate the desk boots
   into a wall of failed panels and offers no way in, so identity is resolved BEFORE any
   Book, market, or plan request leaves the browser. Signed out, exactly two public reads
   have happened: who am I, and how is this instance configured. ---------------------- */
var IDENTITY={authEnabled:false,authenticated:true,user:null,loginUrl:'/auth/login',logoutUrl:null};
function signInName(){var u=IDENTITY.user;return u&&(u.name||u.email||u.id)||null;}
function renderSignIn(loginUrl){
  var app=document.getElementById('app'); if(!app)return;
  app.setAttribute('data-auth','signed-out');
  app.innerHTML='<div class="signin"><div class="signin-card">'
    +'<div class="signin-mark"></div>'
    +'<h1>Sign in</h1>'
    +'<p>StrikeBench is a private instance. Your book, plans, and practice history stay with '
    +'your identity — nothing here is shared or public.</p>'
    +'<a class="btn pri" href="'+deskEsc(loginUrl||IDENTITY.loginUrl||'/auth/login')+'">Continue to sign in</a>'
    +'<p class="signin-foot">You will come back to this desk once your identity is verified.</p>'
    +'</div></div>';
}
function renderStartupFailure(message){
  var app=document.getElementById('app');if(!app)return;
  app.setAttribute('data-auth','unavailable');
  app.innerHTML='<main class="signin" role="alert"><div class="signin-card">'
    +'<div class="signin-mark"></div>'
    +'<h1>The Desk could not start</h1>'
    +'<p>'+deskEsc(message||'The canonical StrikeBench service is unavailable.')+'</p>'
    +'<button type="button" class="btn pri" onclick="window.location.reload()">Retry</button>'
    +'<p class="signin-foot">No market facts, recommendations, or account state were substituted.</p>'
    +'</div></main>';
}
function canonicalDeskAvailable(){
  return !!(window.API&&typeof window.API.get==='function'
    &&window.DeskBackend&&typeof window.DeskBackend.state==='function'
    &&typeof window.DeskBackend.bootstrapWorkspace==='function');
}
/* One owner for a revoked session: any 401 from any read, mid-session or at boot. */
window.addEventListener('strikebench:auth-required',function(e){
  if(document.getElementById('app').getAttribute('data-auth')==='signed-out')return;
  renderSignIn(e&&e.detail&&e.detail.loginUrl);
});

function bootDesk(){
  if(!canonicalDeskAvailable()){
    renderStartupFailure('The canonical Desk service did not load. No fallback workspace was opened.');
    return;
  }
  var app=document.getElementById('app');
  if(app)app.setAttribute('data-auth',IDENTITY.authEnabled?'signed-in':'open');
  renderWhoami();
  boot();
}
function renderWhoami(){
  var el=document.getElementById('whoami'); if(!el)return;
  if(!IDENTITY.authEnabled||!IDENTITY.authenticated){el.hidden=true;el.innerHTML='';return;}
  var name=signInName();
  el.hidden=false;
  el.innerHTML='<span class="whoname" title="'+deskEsc(name||'signed in')+'">'+deskEsc(name||'Signed in')+'</span>'
    +'<a class="wholink" href="'+deskEsc(IDENTITY.logoutUrl||'/auth/logout')+'">Sign out</a>';
}

function bootIdentity(){
  if(!canonicalDeskAvailable()){
    renderStartupFailure('The canonical Desk service did not load. No fallback workspace was opened.');
    return;
  }
  window.API.get('/api/auth/me').then(function(me){
    IDENTITY.authEnabled=!!(me&&me.authEnabled);
    IDENTITY.authenticated=!(me&&me.authEnabled)||!!(me&&me.authenticated);
    IDENTITY.user=me&&me.user||null;
    IDENTITY.loginUrl=me&&me.loginUrl||'/auth/login';
    IDENTITY.logoutUrl=me&&me.logoutUrl||null;
    if(!IDENTITY.authenticated){renderSignIn(IDENTITY.loginUrl);return;}
    bootDesk();
  }).catch(function(error){
    /* Identity determines the account boundary. If it cannot be read, fail closed; booting an
       apparently open desk would invent an authorization state before any financial read. */
    renderStartupFailure('StrikeBench could not verify this session'+
      (error&&error.message?' · '+error.message:'')+'.');
  });
}

function boot(){
  POS=[];byId={};state.focus=null;
  BOOK_AUTH={phase:'loading',data:null,missing:[],error:null,requestId:0};
  stageEl=document.getElementById('stage');
  boardEl=document.getElementById('board');
  bookEl=document.getElementById('book');
  recedeEl=document.getElementById('recede');
  focusEl=document.getElementById('focus');
  summaryEl=document.getElementById('summary');
  crumbsEl=document.getElementById('crumbs');
  cmdEl=document.getElementById('cmd');
  toastEl=document.getElementById('toast');
  decideEl=document.getElementById('decideStage');
  importEl=document.getElementById('importStage');
  learnEl=document.getElementById('learnStage');
  wireGloss();

  /* Escape closes any open overlay first (capture phase, before the zoom-out handler) */
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(learnOpen){ closeLearn(); e.stopPropagation(); e.preventDefault(); return; }
    if(importOpen){ closeImport(); e.stopPropagation(); e.preventDefault(); return; }
    if(decide){exitDecide();e.stopPropagation();e.preventDefault();}
  },true);

  layoutForLevel('book',state.focus);
  updateThread();
  /* The context is restored BEFORE the book, so Home paints with the declaration the user
     already made instead of painting undeclared and then correcting itself. A failed read
     leaves the desk undeclared and says so — it never fabricates a context. */
  window.DeskBackend.bootstrapWorkspace().catch(function(error){
    toast('Your saved workspace could not be read: '+
      (error&&error.message||'the request failed')+'. Nothing was restored.');
  });

  cmdEl.addEventListener('keydown',function(e){ if(e.key==='Enter'){ handleCmd(cmdEl.value); } });
  cmdEl.addEventListener('focus',function(){ cmdEl.placeholder='symbol · sector · or learn — XOM · financials · iron condor · theta'; });
  /* brand mark = the home anchor (was a lone 'Your book' crumb); click zooms all the way out */
  var bh=document.getElementById('brandHome'); if(bh) bh.onclick=function(){ if(decide)exitDecide(); go('book'); };
  /* the symbol pill echoes what the chain/sector lenses point at — click to retarget via the command bar */
  var cs=document.getElementById('cmdSym'); if(cs) cs.onclick=function(){
    if(decide&&decide.canPick){ decide.intentOpen=true;decide.composerKeepOpen=true;decide.ideaDraft=ideaDraftFromDecide(false); decide.pickOpen=true; renderDecide(); var uq=document.getElementById('univq'); if(uq){uq.focus();if(uq.select)uq.select();} return; }
    cmdEl.focus(); if(cmdEl.select)cmdEl.select(); };
  /* persistent New idea — reachable from ANY view (not just the landing) */
  var tni=document.getElementById('threadNewIdea');
  if(tni) tni.onclick=function(){
    if(importOpen)closeImport();
    var refreshBook=!!decide;
    /* Capture the actual source once. An idea already carries the Book/Position destination it
       was opened from; a direct Book/Position command earns that destination now. Avoid the old
       PACKAGE → BOOK → empty-idea sequence, which wrote three workspace states and let the
       intermediate Book repaint steal focus from the permanent workbench. */
    if(!WORKSPACE.returnFocus)workspaceMark();
    if(decide)exitDecide({skipWorkspaceLeave:true,skipBookReload:true});
    go('book',undefined,{skipWorkspaceTransition:true});
    var transition=workspaceTransitionSubject({subject:'MARKET',symbol:null,positionId:null,ideaId:null,
      evaluationId:null,routeState:'idea'},{captureReturn:false});
    homeIdea.query='';authRenderOpportunityOnly();authFocusOpportunityQuery(true);
    transition.persisted.then(function(){
      return refreshBook&&window.DeskBackend&&window.DeskBackend.loadBook
        ?window.DeskBackend.loadBook().catch(function(){return null;}):null;
    }).then(function(){
      /* The authoritative Book refresh may replace the workbench node. Focus only after both
         state adoption and that one refresh settle; the input then remains the keyboard owner. */
      authRenderOpportunityOnly();authFocusOpportunityQuery(true);
    }); };

  /* ---- market mode (Observed = live Cboe data · Simulated = synthetic/demo). Replaces the old
     Beginner/Expert lens (level content is unified now). Conditions chains/candles + the sim controls. ---- */
  var msegs=document.querySelectorAll('#mktMode .mmseg button');
  for(var li=0;li<msegs.length;li++){ (function(b){ b.addEventListener('click',function(){
    setMktMode(b.getAttribute('data-mkt')); }); })(msegs[li]); }

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if(document.activeElement===cmdEl){ cmdEl.blur(); return; }
      var i=LEVELS.indexOf(state.level);
      if(i>0) go(LEVELS[i-1]);
    }
  });

  window.addEventListener('resize',function(){ window.cancelAnimationFrame(rzTimer); rzTimer=window.requestAnimationFrame(redraw); });
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bootIdentity);
else bootIdentity();
/* read-only layout probe for cross-browser audits (?probe=1): fixed overlay reporting the
   real computed geometry, so a screenshot of ANY browser yields numbers, not guesses. */
(function(){if(!/[?&]probe=1/.test(location.search))return;
  var el=document.createElement('div');
  el.className='layoutprobe';
  document.body.appendChild(el);
  window.setInterval(function(){
    var g=document.querySelector('.decgrid'),cols=['.dcleft','.dccenter','.dcright'].map(function(sel){var n=document.querySelector(sel);if(!n)return sel+':—';var b=n.getBoundingClientRect();return sel.slice(1)+':'+Math.round(b.left)+'+'+Math.round(b.width);});
    el.textContent='vp '+innerWidth+'x'+innerHeight+' dpr'+(window.devicePixelRatio||1)+
      '\nscrollW '+document.documentElement.scrollWidth+
      (g?'\ngrid w'+Math.round(g.getBoundingClientRect().width)+'\n'+cols.join('\n')+'\ntpl '+getComputedStyle(g).gridTemplateColumns:'\n(no decgrid)');
  },1000);})();
/* audit/deep links: ?goto=idea:SYM opens a working idea, ?goto=pos:SYM opens that position's
   bloom — the SAME openers the UI uses, nothing parallel. Waits for backend hydration. */
(function(){var m=/[?&]goto=(idea|pos):([A-Za-z0-9.\-]+)/.exec(location.search);if(!m)return;
  var kind=m[1],sym=m[2].toUpperCase(),tries=0;
  var timer=window.setInterval(function(){
    if(++tries>80){window.clearInterval(timer);return;}
    if(!deskBackendEnabled())return;
    if(kind==='pos'){var p=POS.find(function(row){return row.sym===sym;});
      if(p){window.clearInterval(timer);go('position',p.id);}}
    else{if(decide)return;window.clearInterval(timer);authOpenSymbol(sym,null);}
  },500);})();
</script>
