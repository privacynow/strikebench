<script src="strategies.js?v=@asset.version@"></script>
<script src="learn-content.js?v=@asset.version@"></script>

<script>
"use strict";
/* ======================================================================
   OFFLINE VISUAL FIXTURE — used only by the file:// design regression. When
   served by StrikeBench, the Desk bridge replaces decision data and math with
   the canonical market, Plan, recommendation, outcome, and decision APIs.
   legs: {t:'s'|'c'|'p', k, q}  ·  s.k=entry, s.q=shares(±) · opt.q=contracts(±)
   payoff(S) = net + Σ  s: q·(S−k) · c: q·100·max(S−k,0) · p: q·100·max(k−S,0)
   ====================================================================== */
var POS=[];
var byId={};

/* ---- MARKET SCENARIOS (ported from plan-desk: price-path glyphs + Gaussian odds) ---- */
/* each scenario carries editable ASSUMPTIONS: m = price move %, iv = vol-point shift (a crash
   spikes IV, a rally compresses it), d = days elapsed (how long the move takes to play out). */
var SCEN=[
 {n:'Market crash',    dsc:'fast breach · protection defines the floor',m:-20,iv:14, d:5, g:'M2 5 L9 4 L15 7 L21 6 L26 15 L33 19 L42 21'},
 {n:'Gap down',        dsc:'opens lower before the book can adjust',m:-9, iv:8,  d:1, g:'M2 6 L14 6 L16 15 L24 14 L32 16 L42 15'},
 {n:'Orderly pullback',dsc:'drifts toward the downside break-even',m:-6, iv:4,  d:3, g:'M2 7 L10 10 L18 17 L26 18 L34 15 L42 13'},
 {n:'Choppy / sideways',dsc:'whipsaws near spot while time passes',m:-1,iv:1,  d:5, g:'M2 11 L8 5 L14 15 L20 7 L27 16 L34 8 L42 12'},
 {n:'Flat / range',    dsc:'stays inside the range as time decays',m:0,  iv:0,  d:7, g:'M2 11 L10 10 L18 12 L26 10 L34 12 L42 11'},
 {n:'Grind higher',    dsc:'steady upside drift with softer volatility',m:6,  iv:-2, d:10,g:'M2 17 L11 15 L20 12 L30 9 L42 6'},
 {n:'Strong rally',    dsc:'clears the expected range to the upside',m:13, iv:-4, d:10,g:'M2 19 L10 17 L18 13 L27 9 L35 6 L42 3'},
 {n:'Melt-up',          dsc:'accelerates well beyond the expected range',m:20, iv:-6, d:12,g:'M2 20 L11 18 L19 16 L27 11 L34 7 L42 2'}
];
function scenData(p){
  if(p&&p.authoritative){
    /* One source for every surface: the engine's priced checkpoints. An idea carries them on its
       evaluation; a held line carries them on its trade receipt (TradeController.heldScenarios,
       valued through the same curve that owns its terminal payoff). Neither is reconstructed here. */
    var heldTrade=p.isHeld&&p._trade||null;
    var src=p.evaluation&&p.evaluation.risk&&p.evaluation.risk.scenarios
      ||heldTrade&&heldTrade.scenarios||[];
    var points=src.map(function(row){return {m:Number(row.underlyingMovePct)*100,pl:Number(row.pnlCents)/100};})
      .filter(function(row){return Number.isFinite(row.m)&&Number.isFinite(row.pl);}).sort(function(a,b){return a.m-b.m;});
    /* A tile shows a move the ENGINE priced, or it shows nothing. The browser used to fill moves
       the backend never valued by interpolating between checkpoints — and to price all eight in
       the browser for held lines — then print the result as an outcome. RiskProfiler.MOVES IS the
       story set, so an exact lookup succeeds for every tile that has a receipt. */
    if(points.length<2)return {rows:[],best:null,worst:null,ml:null,authoritative:true,unavailable:true};
    var plByMove={}; points.forEach(function(row){plByMove[Math.round(row.m*100)]=row.pl;});
    /* B3: the backend supplies the risk-neutral mass per checkpoint; carry it where a story move
       matches a backend scenario move exactly (no client probability math). */
    var probByMove={}; src.forEach(function(row){ if(row.prob!=null) probByMove[Math.round(Number(row.underlyingMovePct)*1000)]=Number(row.prob); });
    var rows=SCEN.map(function(s,i){var pk=Math.round(s.m/100*1000);return {i:i,s:s,m:s.m,px:p.spot*(1+s.m/100),pl:plByMove[Math.round(s.m*100)],prob:probByMove[pk]==null?null:probByMove[pk]};});
    var positionStored=p.isHeld?authPositionEnsemble(p):null;
    var best=rows[0],worst=rows[0],ml=rows[0],median=positionStored&&positionStored.preview&&positionStored.preview.decisionMap&&positionStored.preview.decisionMap.terminal&&positionStored.preview.decisionMap.terminal.p50||decide&&decide.ensemble&&decide.ensemble.preview&&decide.ensemble.preview.endP50;
    /* No stored median means no median marker — not a 0% move labelled "median terminal
       neighborhood", which is where the tile at spot used to come from. */
    var medianMove=median!=null&&p.spot?((Number(median)/p.spot-1)*100):null;
    /* Rank only over tiles the engine priced — an unpriced tile is not a best/worst candidate and
       must never be read as 0. */
    var priced=rows.filter(function(r){return Number.isFinite(r.pl);});
    best=priced[0]||null;worst=priced[0]||null;
    /* The median tile exists only when the stored ensemble states a median. Nearest-to-zero was
       not "most likely" — it was the tile closest to no move at all. */
    ml=medianMove==null?null:priced[0]||null;
    priced.forEach(function(r){
      if(r.pl>best.pl)best=r;
      if(r.pl<worst.pl)worst=r;
      if(ml&&Math.abs(r.m-medianMove)<Math.abs(ml.m-medianMove))ml=r;
    });
    return {rows:rows,best:best,worst:worst,ml:ml,authoritative:true};
  }
}

/* ---- animation config ---- */
var DUR=340, EASE='cubic-bezier(.22,.68,.28,1)';
var reduce=false;
try{ reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(e){}

/* ---- state = one zoom axis + one focus ---- */
var LEVELS=['book','position'];   /* market + sector are now folded INTO Home (book), not separate zoom levels */
var state={level:'book', focus:POS.length?POS[0].id:null};
var BOOK_AUTH={phase:'fixture',data:null,missing:[],error:null,requestId:0};
/* ---- element handles ---- */
var stageEl, boardEl, bookEl, recedeEl, focusEl, summaryEl, crumbsEl, cmdEl, toastEl;
var cardEl={};

/* ======================================================================
   PAYOFF — leg engine + true-pixel SVG sketch (plan-desk technique:
   measure clientWidth/Height, viewBox 1:1, default preserveAspectRatio)
   ====================================================================== */
/* The priced checkpoint nearest a hovered price, or null when the price is off the served
   curve. One owner for "what did the engine actually say at a price near here". */
function nearestServedPayoffPoint(p,px){
  var pts=p&&Array.isArray(p.payoffPoints)?p.payoffPoints:null;
  if(!pts||!pts.length)return null;
  if(px<pts[0].price||px>pts[pts.length-1].price)return null;
  var best=null,bestGap=Infinity;
  for(var i=0;i<pts.length;i++){
    var gap=Math.abs(pts[i].price-px);
    if(gap<bestGap){bestGap=gap;best=pts[i];}
  }
  return best;
}
function payFor(p,px){
  /* Production candidates carry a server-generated payoff polyline. Linear interpolation is
     display interpolation between authoritative checkpoints, not a browser pricing engine. */
  if(p&&p.authoritative&&Array.isArray(p.payoffPoints)&&p.payoffPoints.length){
    var pts=p.payoffPoints;
    /* OFF-DOMAIN IS UNKNOWN, NOT FLAT. These used to CLAMP: a price beyond the served curve
       silently returned the endpoint value, so a −20% story on a curve that only spans ±30% of the
       ENTRY anchor reported the edge of the receipt as if the engine had priced that move. Return
       null instead; callers that draw a line simply stop, and callers that print a number show it
       as unavailable. */
    if(px<pts[0].price||px>pts[pts.length-1].price)return null;
    for(var pi=1;pi<pts.length;pi++)if(px<=pts[pi].price){
      var a=pts[pi-1],b=pts[pi],w=(px-a.price)/Math.max(1e-9,b.price-a.price);
      return a.profit+(b.profit-a.profit)*w;
    }
  }
  /* A served Desk never reconstructs a missing backend payoff from legs. The local leg engine is
     exclusively the file:// visual fixture; absence remains visible until the preview arrives. */
  if(p&&p.authoritative)return null;
  var t=p.net||0;
  for(var i=0;i<p.legs.length;i++){var l=p.legs[i];
    if(l.t==='s') t+=l.q*(px-l.k);
    else if(l.t==='c') t+=l.q*100*Math.max(0,px-l.k);
    else t+=l.q*100*Math.max(0,l.k-px);
  }
  return t;
}
function payDomain(p){
  if(p&&p.authoritative&&Array.isArray(p.payoffPoints)&&p.payoffPoints.length){
    return [p.payoffPoints[0].price,p.payoffPoints[p.payoffPoints.length-1].price];
  }
  if(p&&p.authoritative)return null;
  var lo=p.spot, hi=p.spot;
  for(var i=0;i<p.legs.length;i++){var l=p.legs[i]; if(l.t!=='s'){ lo=Math.min(lo,l.k); hi=Math.max(hi,l.k); }}
  var mv=p.spot*(p.em/100)*1.7;
  lo=Math.min(lo,p.spot-mv); hi=Math.max(hi,p.spot+mv);
  var pad=(hi-lo)*0.13||p.spot*0.05;
  return [lo-pad, hi+pad];
}
function pfTicks(lo,hi,count){
  var span=hi-lo; if(span<=0)return[lo];
  var step=Math.pow(10,Math.floor(Math.log(span/count)/Math.LN10)), err=(span/count)/step;
  if(err>=7.5)step*=10; else if(err>=3.5)step*=5; else if(err>=1.5)step*=2;
  var out=[]; for(var v=Math.ceil(lo/step)*step; v<=hi+1e-6; v+=step) out.push(Math.round(v*1e6)/1e6);
  return out;
}
function fmtK(a){var s=a<0?'−':''; a=Math.abs(a); return s+(a>=1000?(Math.round(a/100)/10)+'k':''+Math.round(a));}
function beCross(x0,v0,x1,v1){return v0===v1?x0:x0+(x1-x0)*(v0/(v0-v1));}
function breakevens(p){
  if(p&&p.authoritative){
    return Array.isArray(p.breakevens)?p.breakevens.map(Number).filter(Number.isFinite):[];
  }
  var dom=payDomain(p),lo=dom[0],hi=dom[1],n=400,out=[],pv=payFor(p,lo),ppx=lo;
  for(var i=1;i<=n;i++){var px=lo+(hi-lo)*i/n, v=payFor(p,px);
    if((pv<0&&v>=0)||(pv>0&&v<=0)) out.push(beCross(ppx,pv,px,v));
    pv=v; ppx=px;}
  return out;
}
/* A break-even is a PRICE. Rounding it to whole dollars made New Idea state a materially coarser
   level than the Position built from the same receipt ("217" against "$217.16"). */
function beLabel(p){var b=breakevens(p); if(!b.length)return '—'; return b.slice(0,2).map(priceLevel).join(' · ');}

/* payoff tween — a strike/size/premium edit MORPHS the curve smoothly instead of snapping.
   Same leg TYPES → interpolate strikes/qty/net over ~170ms; add/remove leg or type-change draws instantly. */
function payoffSnap(p){ return {net:p.net,spot:p.spot,em:p.em,sym:p.sym,id:p.id,isHeld:p.isHeld,
  pnl:(typeof p.pnl==='number'?p.pnl:null),legs:p.legs.map(function(l){return {t:l.t,k:l.k,q:l.q};})}; }
function sameShape(a,b){ if(!a||!b||a.legs.length!==b.legs.length)return false; for(var i=0;i<a.legs.length;i++){ if(a.legs[i].t!==b.legs[i].t)return false; } return true; }
function lerpP(a,b,t){ return {net:a.net+(b.net-a.net)*t,spot:b.spot,em:b.em,sym:b.sym,id:b.id,isHeld:b.isHeld,
  pnl:(a.pnl!=null&&b.pnl!=null)?a.pnl+(b.pnl-a.pnl)*t:b.pnl,
  legs:b.legs.map(function(l,i){var la=a.legs[i];return {t:l.t,q:la.q+(l.q-la.q)*t,k:la.k+(l.k-la.k)*t};})}; }
/* shared fan/scale PRIMITIVES for the four fan drawers (payoff / MC / book / position-paths) and the
   path hit-tests. ONE definition each; callers keep their own distinct domains + number format.
   fanY is the inverted linear Y scale — only the position-paths Y reduces to it bit-for-bit; the
   book/MC/payoff Y-scales evaluate the same algebra in a different (non-associative) float order and
   stay inline. fanX clamps x to [0,horizon] only when asked (paths yes, book no). fanPathD builds a
   polyline: map/join(' ') style == concat with first='M' sep=' L'; paths' spaced style == 'M ' / ' L '. */
function fanY(v,y0,y1,lo,hi){return y1-(y1-y0)*(v-lo)/(hi-lo);}
function fanX(day,x0,x1,horizon,clamp){var d=clamp?Math.max(0,Math.min(horizon,Number(day))):day;return x0+(x1-x0)*d/horizon;}
function fanPathDay(i,path,progress,horizon){return progress&&progress[i]!=null?Number(progress[i]):horizon*i/Math.max(1,path.length-1);}
function fanPathD(pts,fx,fy,first,sep){var d='';for(var i=0;i<pts.length;i++)d+=(i?sep:first)+fx(pts[i],i).toFixed(1)+' '+fy(pts[i],i).toFixed(1);return d;}
function fanSampleAt(path,day,progress,horizon){if(!path.length)return null;if(progress.length===path.length){if(day<=Number(progress[0]))return Number(path[0]);for(var i=1;i<progress.length;i++){var right=Number(progress[i]);if(day<=right){var left=Number(progress[i-1]),f=right===left?0:(day-left)/(right-left);return authLerp(Number(path[i-1]),Number(path[i]),Math.max(0,Math.min(1,f)));}}return Number(path[path.length-1]);}var cursor=horizon?day/horizon*Math.max(0,path.length-1):0,loIndex=Math.floor(cursor),hiIndex=Math.min(path.length-1,loIndex+1);return authLerp(Number(path[loIndex]),Number(path[hiIndex]),cursor-loIndex);}
function drawPayoff(svg,p,full,ghost,opts){
  if(!svg)return; opts=opts||{};
  if(p&&p.authoritative&&(!Array.isArray(p.payoffPoints)||p.payoffPoints.length<2)){
    var emptyW=Math.max(40,Math.round(svg.clientWidth||(full?520:170))),emptyH=Math.max(24,Math.round(svg.clientHeight||(full?260:46)));
    svg.setAttribute('viewBox','0 0 '+emptyW+' '+emptyH);svg._snap=null;svg._map=null;
    svg.innerHTML='<line x1="8" y1="'+(emptyH/2).toFixed(1)+'" x2="'+(emptyW-8)+'" y2="'+(emptyH/2).toFixed(1)+'" stroke="var(--line-soft)" stroke-dasharray="3 5"/>'+
      (full?'<text x="'+(emptyW/2).toFixed(1)+'" y="'+(emptyH/2-9).toFixed(1)+'" text-anchor="middle" fill="var(--dim)" font-size="11">Backend payoff checkpoints loading</text>':'');
    return;
  }
  if(opts.animate && !p.authoritative && !reduce && svg._snap && sameShape(svg._snap,p)){
    var from=svg._snap, to=payoffSnap(p);
    if(svg._tw) cancelAnimationFrame(svg._tw);
    var o2={}; for(var kk in opts) o2[kk]=opts[kk]; o2.animate=false;
    var dur=170, start=null;
    var stepFn=function(ts){ if(start==null)start=ts; var t=Math.min(1,(ts-start)/dur), e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      drawPayoff(svg, lerpP(from,to,e), full, ghost, o2);
      if(t<1) svg._tw=requestAnimationFrame(stepFn); else { svg._tw=null; svg._snap=to; } };
    svg._tw=requestAnimationFrame(stepFn); return;
  }
  var W=Math.max(40,Math.round(svg.clientWidth||(full?520:170)));
  var H=Math.max(24,Math.round(svg.clientHeight||(full?260:46)));
  var compactHero=full&&(H<145||(p.isHeld&&H<240));
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var dom=payDomain(p), lo=dom[0], hi=dom[1];
  /* adjust-in-place: a GHOST (the current structure) is drawn faint under the adjusted
     curve; widen the domain so both fit on the same axes (before → after). */
  if(ghost){ var gdom=payDomain(ghost); lo=Math.min(lo,gdom[0]); hi=Math.max(hi,gdom[1]); }
  /* a pinned/reshaped what-if beyond the normal window (e.g. a −20% crash) zooms the chart out
     so the marker is actually visible. */
  if(opts.pinM!=null){ var pp=p.spot*(1+opts.pinM/100), pad0=(hi-lo)*0.05; lo=Math.min(lo,pp-pad0); hi=Math.max(hi,pp+pad0); }
  /* on the full hero, widen left just enough to SHOW the characteristic gap — the crash region and
     the distribution's fat left tail become visible instead of sitting off-screen. */
  var mL=full?56:3, mR=full?18:3, mT=full?(compactHero?16:22):5, mB=full?(compactHero?32:38):5;
  var x0=mL, x1=W-mR, y0=mT, y1=H-mB, pw=x1-x0, ph=y1-y0;
  var n=full?200:80, pts=[], vmin=0, vmax=0;
  for(var i=0;i<=n;i++){var px=lo+(hi-lo)*i/n, v=payFor(p,px); pts.push([px,v]); if(v<vmin)vmin=v; if(v>vmax)vmax=v;}
  /* vmin/vmax drive the max-profit/loss plateau labels; the drawn Y-DOMAIN also includes
     the current mark P/L so the "now" mark dot always lands on-chart (e.g. MU's mark sits
     above the curve's at-expiry cap). */
  var yDomLo=vmin, yDomHi=vmax;
  if(full&&typeof p.pnl==='number'){ yDomLo=Math.min(yDomLo,p.pnl); yDomHi=Math.max(yDomHi,p.pnl); }
  if(ghost){ for(var gi=0;gi<=n;gi++){ var gv=payFor(ghost,lo+(hi-lo)*gi/n); if(gv<yDomLo)yDomLo=gv; if(gv>yDomHi)yDomHi=gv; } }
  var padY=(yDomHi-yDomLo)*0.18||100, yLo=yDomLo-padY, yHi=yDomHi+padY;
  function sx(px){return x0+(px-lo)/(hi-lo)*pw;}
  function sy(v){return y1-(v-yLo)/(yHi-yLo)*ph;}
  function f(v){return Math.round(v*10)/10;}
  function hx(v){return Math.round(v)+0.5;}
  var zY=sy(0), uid=p.id.replace(/[^a-z0-9]/gi,'')+(full?'F':'S'), g='';
  g+='<defs>';
  g+='<linearGradient id="gp'+uid+'" x1="0" y1="'+y0+'" x2="0" y2="'+zY+'" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--profit)" stop-opacity=".28"/><stop offset="1" stop-color="var(--profit)" stop-opacity=".02"/></linearGradient>';
  g+='<linearGradient id="gl'+uid+'" x1="0" y1="'+zY+'" x2="0" y2="'+y1+'" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--loss)" stop-opacity=".02"/><stop offset="1" stop-color="var(--loss)" stop-opacity=".24"/></linearGradient>';
  g+='<clipPath id="cp'+uid+'"><rect x="'+x0+'" y="'+y0+'" width="'+pw+'" height="'+Math.max(0,zY-y0)+'"/></clipPath>';
  g+='<clipPath id="cl'+uid+'"><rect x="'+x0+'" y="'+zY+'" width="'+pw+'" height="'+Math.max(0,y1-zY)+'"/></clipPath>';

     position→position (and →book) breathe symmetrically, not one-sided. */

function handleCmd(raw){

    if(p.sym.toLowerCase()===q || p.struct.toLowerCase().indexOf(q)>=0){ go('position',p.id); cmdEl.value=''; return; }
  }

}

/* §3.3: ONE component for "what is this price made of", used by the order dock, the candidate

/* ONE line, and only where it is needed: when a package moves cash in shares as well as options,
   the hero's option-only "net credit" and the dock's whole-package net are DIFFERENT numbers for
   the same trade. This states the bridge between them inline rather than leaving the reader to
   discover it. An options-only package needs no line — the two numbers are the same. */
function packagePriceReconcileLine(price){

    +'<span>options <b>'+authSigned(opt)+'</b></span>'
    +'<span>shares <b>'+authSigned(stock)+'</b></span>'
    +'<span class="prsum">package <b>'+authSigned(gross)+'</b></span></div>';

function packagePriceReceiptHTML(price,what){

    var key=g.getAttribute('data-gov');decide.govs[key]=+g.value;decide.govExplicit[key]=true;renderDecide(); });
}

/* ======================================================================
   SHARED OVERLAY (Import + Book-risk) — reuses the .decstage surface + the
   breathing FLIP entry (flipBreath) so these lenses feel like the same canvas.
   ====================================================================== */
var importEl, importOpen=false;
function overlayShow(el, origin){
  el.style.display='block'; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); el.setAttribute('aria-hidden','false');
  el.scrollTop=0;
  var wrap=el.querySelector('.ovwrap');
  if(reduce||!wrap||!origin)return;
  flipBreath(wrap, origin, true, function(){});
}
function overlayHide(el, origin, after){
  el.setAttribute('aria-hidden','true');
  var wrap=el.querySelector('.ovwrap');
  if(reduce||!wrap||!origin){ el.classList.remove('on'); window.setTimeout(function(){ el.style.display='none'; if(after)after(); },160); return; }
  flipBreath(wrap, origin, false); el.classList.remove('on');
  window.setTimeout(function(){ el.style.display='none'; if(after)after(); }, DUR);
}

/* ======================================================================
   IMPORT — bring an outside position into a tracked account.

   The desk used to hold four invented brokerage rows and price them in the browser; the served
   build could not use them at all, so the button did a full page navigation to a hash left over
   from the deleted SPA. That reload was what wiped the declaration and the world indicator
   (audit §5.6): the whole workspace lived in memory, and the page was thrown away.

   Now it is one overlay over ONE backend journey — paste → preview → confirm. The server parses
   the statement, marks each package EXACT FILLS or PACKAGE NET, and writes only the groups the
   user selected; groups that report a package net without per-leg prices go to the pending
   quarantine rather than the accounting ledger. Nothing here parses, prices or infers.
   ====================================================================== */
var IMPORT_BROKERS=[
  {id:'ETRADE',label:'E*TRADE'},{id:'SCHWAB',label:'Schwab'},{id:'FIDELITY',label:'Fidelity'},
  {id:'THINKORSWIM',label:'ThinkOrSwim'},{id:'VANGUARD',label:'Vanguard'},{id:'ROBINHOOD',label:'Robinhood'}
];
var imp={broker:null,account:'',text:'',phase:'idle',preview:null,error:null,
  selected:{},destination:{},accounts:[],result:null,busy:false,_origin:null};
function openImport(origin){
  imp={broker:null,account:'',text:'',phase:'idle',preview:null,error:null,
    selected:{},destination:{},accounts:[],result:null,busy:false,_origin:origin||null};
  workspaceMark();                       /* Back returns where the user actually was */
  importEl.innerHTML=renderImport(); importOpen=true;
  wireImport();
  overlayShow(importEl, origin);
  if(deskBackendEnabled()&&window.DeskBackend.importAccounts){
    window.DeskBackend.importAccounts().then(function(accounts){
      imp.accounts=accounts||[];refreshImport();
    }).catch(function(error){
      imp.error=error&&error.message||'The tracked accounts could not be read.';refreshImport();
    });
  }
}
function closeImport(){ if(!importOpen)return; importOpen=false; var o=imp._origin; overlayHide(importEl, o); }

/* ---- the journey, as three states of one surface ---- */
function importReadable(){return !!(imp.broker&&String(imp.text||'').trim().length>0);}
function runImportPreview(){
  if(!importReadable()||imp.busy)return;
  imp.busy=true;imp.error=null;imp.phase='reading';imp.result=null;refreshImport();
  window.DeskBackend.previewBrokerImport({sourceSystem:imp.broker,sourceAccount:imp.account||null,text:imp.text})
    .then(function(preview){
      imp.busy=false;imp.preview=preview;imp.phase='previewed';
      /* Exact-fill groups start selected because they are complete; a package-net group is an
         explicit choice to quarantine, so the user opts in to it. */
      imp.selected={};
      (preview&&preview.parsed&&preview.parsed.groups||[]).forEach(function(g){
        imp.selected[g.groupKey]=g.kind==='EXACT_FILLS';
      });
      refreshImport();
    }).catch(function(error){
      imp.busy=false;imp.phase='idle';
      imp.error=error&&error.message||'The statement could not be read.';refreshImport();
    });
}
function runImportConfirm(){
  var groups=importSelectedGroups(); if(!groups.length||imp.busy)return;
  var parsed=imp.preview&&imp.preview.parsed||{};
  imp.busy=true;imp.error=null;refreshImport();
  window.DeskBackend.confirmBrokerImport({
    previewFingerprint:parsed.previewFingerprint,sourceSystem:imp.broker,
    sourceAccount:imp.account||null,text:imp.text,
    destinationAccountByFingerprint:imp.destination,
    groups:groups.map(function(g){return {groupKey:g.groupKey,legs:g.legs.map(importVerifiedLeg)};})
  }).then(function(result){
    imp.busy=false;imp.result=result;imp.phase='confirmed';refreshImport();
    if(window.DeskBackend.loadBook)window.DeskBackend.loadBook().catch(function(){});
  }).catch(function(error){
    imp.busy=false;imp.error=error&&error.message||'The import could not be confirmed.';refreshImport();
  });
}
/* The user's verification is an acknowledgement of what the server parsed — never a re-statement
   of it. Every field is echoed back exactly as parsed; only `acknowledgeInferred` is ours. */
function importVerifiedLeg(leg){
  return {legNo:leg.legNo,instrumentType:leg.instrumentType,action:leg.action,
    positionEffect:leg.positionEffect,symbol:leg.symbol,optionType:leg.optionType,
    strike:leg.strike,expiration:leg.expiration,quantity:leg.quantity,multiplier:leg.multiplier,
    acknowledgeInferred:importLegInferred(leg)};
}
function importLegInferred(leg){
  return (leg.checks||[]).some(function(check){return check&&check.verify;});
}
/* A count the server did not report is reported as absent, not as zero (§3.2). */
function importCount(v){var n=authNumber(v);return n==null?'—':Math.round(n).toLocaleString();}
function importGroups(){return imp.preview&&imp.preview.parsed&&imp.preview.parsed.groups||[];}
function importSelectedGroups(){return importGroups().filter(function(g){return imp.selected[g.groupKey];});}
function importMarksFor(groupKey){
  var all=imp.preview&&imp.preview.marks||[];
  for(var i=0;i<all.length;i++)if(all[i].groupKey===groupKey)return all[i];
  return null;
}

/* One destination per source ACCOUNT, chosen once. Packages exported from the same brokerage

/* Re-render the preview column only: the paste box holds focus and a caret, and rebuilding the
   whole overlay under the user's cursor is what made the old surface feel like it fought back. */
function refreshImport(){

  if(col)col.innerHTML=importPreviewHTML();

  if(read){read.disabled=!importReadable()||imp.busy;read.textContent=imp.phase==='reading'?'Reading…':'Read this statement →';}

function wireImport(){
  if(importEl._wired)return; importEl._wired=1;
  importEl.addEventListener('click',function(e){ var t=e.target;
    var broker=t.closest('[data-imp-broker]');

    var group=t.closest('[data-imp-group]');

    var a=t.closest('[data-imp-act]');

/* ---- BOOK-RISK LENS: interrogate the whole book via the exposure map (below). The former fixture
   governor cards (concentration/expiry/churn/contradiction hero + SMH-hedge) are deleted — they read
   a hardcoded semis book and the removed bookTail/hedgeProposal, and had no live callers. ---- */
/* continuous risk-temperature: green(profit) -> amber(caution) -> red(loss) */
function tempColor(t){ t=Math.max(0,Math.min(1,t));
  var a=[0x41,0xC8,0x92], b=[0xE7,0xAC,0x44], c=[0xF3,0x5D,0x64], lo,hi,f;
  if(t<0.5){lo=a;hi=b;f=t/0.5;} else {lo=b;hi=c;f=(t-0.5)/0.5;}
  return 'rgb('+Math.round(lo[0]+(hi[0]-lo[0])*f)+','+Math.round(lo[1]+(hi[1]-lo[1])*f)+','+Math.round(lo[2]+(hi[2]-lo[2])*f)+')';
}
var expMapPts=null; /* cached dot geometry for box-select hit-testing */
function drawExposureMap(cfg){
  cfg=cfg||{svg:'rkExpMap', info:'rkSelInfo'};
  var svg=document.getElementById(cfg.svg); if(!svg)return;
  var W=Math.max(320,Math.round(svg.clientWidth||600)), H=Math.max(150,Math.round(svg.clientHeight||220));
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var padL=44,padB=26,padT=14,padR=16;
  /* One shared X axis compares positions, so it must carry a comparable unit. Share delta is not
     one: 100 delta of a $30 name and 100 delta of a $900 name sat at the same x. Dollar delta is
     the exposure each position actually carries per $1 move, and it is what the book receipt
     publishes per row. A position with no measured delta plots at the axis with its own marker
     rather than silently at zero. */
  var caps=POS.map(function(p){return p.cap;}), dl=POS.map(function(p){return Number(p.dollarDelta)||0;});
  var cHi=Math.max.apply(0,caps)*1.08, cLo=0;
  var dMax=Math.max(0.8,Math.max.apply(0,dl.map(Math.abs))*1.15);
  var X=function(d){return padL+(W-padL-padR)*(d+dMax)/(2*dMax);};
  var Y=function(v){return H-padB-(H-padB-padT)*(v-cLo)/((cHi-cLo)||1);};
  /* Dot temperature encodes each position's SHARE OF DEFINED BOOK RISK — p.riskPct, derived from the
     backend's maxLossCents. It used to re-price every position in the browser at a hard-coded −11%
     gap via payFor(), which originated a stress loss the backend never sent (and the pooled readout
     then labelled that 11% figure "If −10%"). BookRiskService owns the canonical shock (SHOCK_PCT);
     until a per-position stress receipt is served, the map encodes only what the backend states. */
  var heat=POS.map(function(p){return Math.max(0,Number(p.riskPct)||0);});
  var maxHeat=Math.max.apply(0,heat)||1;
  var g='';
  var xz=X(0);
  g+='<line x1="'+xz.toFixed(1)+'" y1="'+padT+'" x2="'+xz.toFixed(1)+'" y2="'+(H-padB)+'" stroke="var(--line)" stroke-dasharray="3 3"/>';
  g+='<text x="'+(padL+2)+'" y="'+(padT+11)+'" fill="var(--faint)" font-size="12">short exposure</text>';
  g+='<text x="'+(W-padR-2)+'" y="'+(padT+11)+'" fill="var(--faint)" font-size="12" text-anchor="end">long exposure</text>';
  [0.25,0.5,0.75,1].forEach(function(f){var v=cHi*f,yy=Y(v);g+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'" stroke="var(--line-soft)"/>';g+='<text x="'+(padL-5)+'" y="'+(yy+3).toFixed(1)+'" fill="var(--faint)" font-size="12" text-anchor="end" font-family="ui-monospace">'+(v>=1000?'$'+Math.round(v/1000)+'k':'$'+Math.round(v))+'</text>';});
  g+='<rect class="rkSelRect" x="0" y="0" width="0" height="0" fill="var(--accent)" fill-opacity=".08" stroke="var(--accent)" stroke-dasharray="4 3" style="display:none;pointer-events:none"/>';
  var pts=[];
  POS.forEach(function(p,i){var x=X(Number(p.dollarDelta)||0),y=Y(p.cap),r=6+Math.min(11,(Number(p.riskPct)||0)/3);
    var col=tempColor(heat[i]/maxHeat);
    pts.push({id:p.id,x:x,y:y,r:r,sym:p.sym,col:col});
    g+='<circle class="rkdot" data-id="'+p.id+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+col+'" fill-opacity=".22" stroke="'+col+'" stroke-width="1.4" data-goto="'+p.id+'" style="cursor:pointer"/>';
  });
  /* ticker labels: score each candidate slot (below/above/right/left/diagonals) by out-of-bounds,
     clash with already-placed labels, and overlap with ANY dot (incl. its own) — pick the lowest
     score, so a label near an edge FLIPS to a side that fits instead of being clamped onto its dot
     (the NVDA-on-the-floor bug). Owner: move the ticker wherever it fits, never overwrite. */
  var lboxes=[];
  pts.forEach(function(pt){ var lw=pt.sym.length*6.4+3, lh=12;
    var cands=[[pt.x,pt.y+pt.r+11],[pt.x,pt.y-pt.r-5],[pt.x+pt.r+4+lw/2,pt.y+3.4],[pt.x-pt.r-4-lw/2,pt.y+3.4],
               [pt.x+pt.r*0.7+lw/2,pt.y+pt.r+11],[pt.x-pt.r*0.7-lw/2,pt.y-pt.r-5]];

    var t=GBY[g.getAttribute('data-term').toLowerCase()]; if(!t)return;
    pop.innerHTML='<b>'+t.t+'</b>'+(t.alias?' <span class="ga">'+t.alias+'</span>':'')+'<div class="gpd">'+t.def+'</div><div class="gph">click to open in Learn</div>';
    var r=g.getBoundingClientRect(); pop.style.display='block';
    var pw=pop.offsetWidth,ph=pop.offsetHeight,left=Math.max(6,Math.min(window.innerWidth-pw-6,r.left));
    var top=r.bottom+7; if(top+ph>window.innerHeight-6)top=Math.max(6,r.top-ph-7);
    pop.style.left=left+'px'; pop.style.top=top+'px'; void pop.offsetWidth; pop.classList.add('on'); });
  document.addEventListener('mouseout',function(e){ var g=e.target.closest&&e.target.closest('.gloss[data-term]'); if(g){ pop.classList.remove('on'); pop.style.display='none'; } }); }

/* ---- Identity gate -------------------------------------------------------------------
   A private instance answers every protected read with 401. Without a gate the desk boots
   into a wall of failed panels and offers no way in, so identity is resolved BEFORE any
   Book, market, or plan request leaves the browser. Signed out, exactly two public reads
   have happened: who am I, and how is this instance configured. ---------------------- */
var IDENTITY={authEnabled:false,authenticated:true,user:null,loginUrl:'/auth/login',logoutUrl:null};
function signInName(){var u=IDENTITY.user;return u&&(u.name||u.email||u.id)||null;}
function renderSignIn(loginUrl){
  var app=document.getElementById('app'); if(!app)return;
  app.setAttribute('data-auth','signed-out');
  app.innerHTML='<div class="signin"><div class="signin-card">'
    +'<div class="signin-mark"></div>'
    +'<h1>Sign in</h1>'
    +'<p>StrikeBench is a private instance. Your book, plans, and practice history stay with '
    +'your identity — nothing here is shared or public.</p>'
    +'<a class="btn pri" href="'+deskEsc(loginUrl||IDENTITY.loginUrl||'/auth/login')+'">Continue to sign in</a>'
    +'<p class="signin-foot">You will come back to this desk once your identity is verified.</p>'
    +'</div></div>';
}
/* One owner for a revoked session: any 401 from any read, mid-session or at boot. */
window.addEventListener('strikebench:auth-required',function(e){
  if(document.getElementById('app').getAttribute('data-auth')==='signed-out')return;
  renderSignIn(e&&e.detail&&e.detail.loginUrl);
});

function bootDesk(){
  var app=document.getElementById('app');
  if(app)app.setAttribute('data-auth',IDENTITY.authEnabled?'signed-in':'open');
  renderWhoami();
  boot();
}
function renderWhoami(){
  var el=document.getElementById('whoami'); if(!el)return;
  if(!IDENTITY.authEnabled||!IDENTITY.authenticated){el.hidden=true;el.innerHTML='';return;}
  var name=signInName();
  el.hidden=false;
  el.innerHTML='<span class="whoname" title="'+deskEsc(name||'signed in')+'">'+deskEsc(name||'Signed in')+'</span>'
    +'<a class="wholink" href="'+deskEsc(IDENTITY.logoutUrl||'/auth/logout')+'">Sign out</a>';
}

function bootIdentity(){
  if(!deskBackendEnabled()||!window.API){bootDesk();return;}
  window.API.get('/api/auth/me').then(function(me){
    IDENTITY.authEnabled=!!(me&&me.authEnabled);
    IDENTITY.authenticated=!(me&&me.authEnabled)||!!(me&&me.authenticated);
    IDENTITY.user=me&&me.user||null;
    IDENTITY.loginUrl=me&&me.loginUrl||'/auth/login';
    IDENTITY.logoutUrl=me&&me.logoutUrl||null;
    if(!IDENTITY.authenticated){renderSignIn(IDENTITY.loginUrl);return;}
    bootDesk();
  }).catch(function(){
    /* Identity itself is unreachable. The desk boots and every panel reports its own typed
       failure — inventing a signed-in session here would be the worse lie. */
    bootDesk();
  });
}

function boot(){
  var served=deskBackendEnabled();
  if(served){POS=[];byId={};state.focus=null;BOOK_AUTH={phase:'loading',data:null,missing:[],error:null,requestId:0};}
  /* one POP definition everywhere: run held positions through the SAME tail-aware model as
     candidates, so a card's 'Chance' matches its own bell + scenario bars (no stale literals).
     Parse each line's expiry so the event-calendar check knows whether a catalyst lands in-window. */
  POS.forEach(function(p){ if(!p.exp){ var m=(p.legStr||'').match(/exp ([0-9]{2}-[A-Za-z]{3})/); if(m)p.exp=m[1]; } });
  stageEl=document.getElementById('stage');
  boardEl=document.getElementById('board');
  bookEl=document.getElementById('book');
  recedeEl=document.getElementById('recede');
  focusEl=document.getElementById('focus');
  summaryEl=document.getElementById('summary');
  crumbsEl=document.getElementById('crumbs');
  cmdEl=document.getElementById('cmd');
  toastEl=document.getElementById('toast');
  decideEl=document.getElementById('decideStage');
  importEl=document.getElementById('importStage');
  learnEl=document.getElementById('learnStage');
  wireGloss();

  /* Escape closes any open overlay first (capture phase, before the zoom-out handler) */
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(learnOpen){ closeLearn(); e.stopPropagation(); e.preventDefault(); return; }
    if(importOpen){ closeImport(); e.stopPropagation(); e.preventDefault(); return; }
    if(decide){exitDecide();e.stopPropagation();e.preventDefault();}
  },true);

  for(var i=0;i<POS.length;i++){ cardEl[POS[i].id]=makeCard(POS[i]); }

  layoutForLevel('book',state.focus);
  updateThread();
  if(served){
    /* The context is restored BEFORE the book, so Home paints with the declaration the user
       already made instead of painting undeclared and then correcting itself. A failed read
       leaves the desk undeclared and says so — it never fabricates a context. */
    window.DeskBackend.loadWorkspace().then(function(saved){
      workspaceHydrate(saved);paintMarketMode();
      if(state.level==='book'&&BOOK_AUTH.data&&typeof authRenderOpportunityOnly==='function')
        authRenderOpportunityOnly();
    }).catch(function(error){
      toast('Your saved workspace could not be read: '+
        (error&&error.message||'the request failed')+'. Nothing was restored.');
    });
    window.DeskBackend.loadBook().catch(function(){ /* typed book-error renders through the bridge */ });
  }

  cmdEl.addEventListener('keydown',function(e){ if(e.key==='Enter'){ handleCmd(cmdEl.value); } });
  cmdEl.addEventListener('focus',function(){ cmdEl.placeholder='symbol · sector · or learn — XOM · financials · iron condor · theta'; });
  /* brand mark = the home anchor (was a lone 'Your book' crumb); click zooms all the way out */
  var bh=document.getElementById('brandHome'); if(bh) bh.onclick=function(){ if(decide)exitDecide(); go('book'); };
  /* the symbol pill echoes what the chain/sector lenses point at — click to retarget via the command bar */
  var cs=document.getElementById('cmdSym'); if(cs) cs.onclick=function(){
    if(decide&&decide.canPick){ decide.intentOpen=true;decide.composerKeepOpen=true;decide.ideaDraft=ideaDraftFromDecide(false); decide.pickOpen=true; renderDecide(); var uq=document.getElementById('univq'); if(uq){uq.focus();if(uq.select)uq.select();} return; }
    cmdEl.focus(); if(cmdEl.select)cmdEl.select(); };
  /* persistent New idea — reachable from ANY view (not just the landing) */
  var tni=document.getElementById('threadNewIdea');
  if(tni) tni.onclick=function(){
    if(importOpen)closeImport(); if(decide)exitDecide();
    homeIdea.symbol=null;homeIdea.query='';homeIdea.targetCents=null;homeIdea.holdingsShares=null;
    go('book');authRenderOpportunityOnly();
    var input=document.querySelector('[data-auth-workbench-query]');
    if(input){input.focus({preventScroll:true});if(input.select)input.select();input.scrollIntoView({block:'nearest'});} };

  /* ---- market mode (Observed = live Cboe data · Simulated = synthetic/demo). Replaces the old
     Beginner/Expert lens (level content is unified now). Conditions chains/candles + the sim controls. ---- */
  var msegs=document.querySelectorAll('#mktMode .mmseg button');
  for(var li=0;li<msegs.length;li++){ (function(b){ b.addEventListener('click',function(){
    setMktMode(b.getAttribute('data-mkt')); }); })(msegs[li]); }

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if(document.activeElement===cmdEl){ cmdEl.blur(); return; }
      var i=LEVELS.indexOf(state.level);
      if(i>0) go(LEVELS[i-1]);
    }
  });

  window.addEventListener('resize',function(){ window.cancelAnimationFrame(rzTimer); rzTimer=window.requestAnimationFrame(redraw); });
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bootIdentity);
else bootIdentity();
/* read-only layout probe for cross-browser audits (?probe=1): fixed overlay reporting the
   real computed geometry, so a screenshot of ANY browser yields numbers, not guesses. */
(function(){if(!/[?&]probe=1/.test(location.search))return;
  var el=document.createElement('div');
  el.style.cssText='position:fixed;right:6px;bottom:6px;z-index:99999;background:#000c;border:1px solid #0ff;color:#0ff;font:11px monospace;padding:6px 8px;pointer-events:none;white-space:pre;text-align:left';
  document.body.appendChild(el);
  window.setInterval(function(){
    var g=document.querySelector('.decgrid'),cols=['.dcleft','.dccenter','.dcright'].map(function(sel){var n=document.querySelector(sel);if(!n)return sel+':—';var b=n.getBoundingClientRect();return sel.slice(1)+':'+Math.round(b.left)+'+'+Math.round(b.width);});
    el.textContent='vp '+innerWidth+'x'+innerHeight+' dpr'+(window.devicePixelRatio||1)+
      '\nscrollW '+document.documentElement.scrollWidth+
      (g?'\ngrid w'+Math.round(g.getBoundingClientRect().width)+'\n'+cols.join('\n')+'\ntpl '+getComputedStyle(g).gridTemplateColumns:'\n(no decgrid)');
  },1000);})();
/* audit/deep links: ?goto=idea:SYM opens a working idea, ?goto=pos:SYM opens that position's
   bloom — the SAME openers the UI uses, nothing parallel. Waits for backend hydration. */
(function(){var m=/[?&]goto=(idea|pos):([A-Za-z0-9.\-]+)/.exec(location.search);if(!m)return;
  var kind=m[1],sym=m[2].toUpperCase(),tries=0;
  var timer=window.setInterval(function(){
    if(++tries>80){window.clearInterval(timer);return;}
    if(!deskBackendEnabled())return;
    if(kind==='pos'){var p=POS.find(function(row){return row.sym===sym;});
      if(p){window.clearInterval(timer);go('position',p.id);}}
    else{if(decide)return;window.clearInterval(timer);authOpenSymbol(sym,null);}
  },500);})();
</script>
</body>
